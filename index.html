<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Material Control · CS WIND Internal Warehouse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%230067AC'/><text x='32' y='30' font-family='Arial Narrow,Arial,sans-serif' font-weight='800' font-size='24' fill='white' text-anchor='middle'>CS</text><text x='32' y='46' font-family='Arial Narrow,Arial,sans-serif' font-weight='700' font-size='13' letter-spacing='1.5' fill='%2300A1E4' text-anchor='middle'>WIND</text></svg>">
<style>
:root{
  /* MÀU CHUẨN CS WIND — #0067AC (CS) & #00A1E4 (WIND / cánh quạt) */
  --navy:#0067AC;          /* xanh dương đậm — chủ đạo */
  --navy-d:#004E84;        /* đậm hơn cho gradient/nền */
  --navy-l:#0079C7;
  --wind:#0067AC;          /* nhấn chính */
  --wind-2:#00A1E4;        /* xanh dương nhạt thương hiệu */
  --sky:#4FC3F0; --sky-l:#E4F5FD;
  --ink:#023253;
  --safety:#E87722; --safety-d:#c9601a; --teal:#0e8f78; --rust:#c0432a;
  --paper:#f2f7fb; --paper-2:#e2eef7; --card:#ffffff; --line:#d3e3ef; --line-2:#ebf3f9;
  --text:#12293c; --muted:#54718a; --faint:#8faec4;
  --grid:rgba(0,103,172,.05); --grid-2:rgba(0,103,172,.085);
  --sh-sm:0 1px 3px rgba(0,78,132,.08);
  --sh:0 4px 16px rgba(0,78,132,.12);
  --sh-lg:0 18px 50px rgba(2,50,83,.24);
  --cond:'Barlow Condensed',sans-serif; --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
  --topH:56px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:'Inter',system-ui,-apple-system,sans-serif;color:var(--text);font-size:15px;line-height:1.45;
  padding-bottom:32px;overscroll-behavior-y:contain;-webkit-font-smoothing:antialiased;
  background-color:var(--paper);
}
button{font-family:inherit;cursor:pointer;color:inherit}
.mono{font-family:var(--mono)}
.grow{flex:1}
.hidden{display:none!important}

/* ===== header ===== */
/* ===== TOP BAR: thương hiệu + điều hướng, xanh đậm ===== */
.top{position:sticky;top:0;z-index:30;background:linear-gradient(180deg,var(--navy),var(--navy-d));
  color:#fff;box-shadow:0 2px 16px rgba(13,39,67,.28);position:relative}
.top::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;
  background:repeating-linear-gradient(90deg,var(--safety) 0 3px,transparent 3px 16px);opacity:.85}
.topin{display:flex;align-items:center;gap:20px;padding:0 20px;height:var(--topH);width:100%}
.brand{display:flex;align-items:center;gap:10px;flex-shrink:0}
.mk{display:flex;align-items:center;gap:7px;height:32px;padding:0 10px;flex-shrink:0;
  background:#fff;border-radius:6px;line-height:1}
.mk .cs{font-family:var(--cond);font-weight:800;font-size:18px;letter-spacing:.01em;color:#0067AC}
.mk .wd{font-family:var(--cond);font-weight:700;font-size:18px;letter-spacing:.06em;color:#00A1E4;font-style:italic}
.mk svg{display:block;flex-shrink:0}
.bt .n{font-family:var(--cond);font-weight:700;font-size:19px;letter-spacing:.06em;text-transform:uppercase;color:#fff;white-space:nowrap}
.icobtn{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.16);color:#fff;width:34px;height:34px;border-radius:8px;font-size:17px;display:grid;place-items:center;transition:.15s;flex-shrink:0}
.icobtn:active{background:rgba(255,255,255,.28)}

/* điều hướng nằm luôn trên thanh trên cùng */
.nav{display:flex;align-items:center;gap:2px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav button{background:none;border:none;color:rgba(255,255,255,.62);font-family:var(--cond);font-size:15px;font-weight:600;
  letter-spacing:.05em;text-transform:uppercase;display:flex;align-items:center;gap:7px;padding:0 15px;height:var(--topH);
  border-bottom:3px solid transparent;white-space:nowrap;transition:.14s}
.nav button:hover{color:#fff;background:rgba(255,255,255,.06)}
.nav button .i{font-size:15px;opacity:.9}
.nav button.on{color:#fff;border-bottom-color:var(--safety);background:rgba(255,255,255,.08)}

/* ===== search ===== */
.searchwrap{max-width:1500px;margin:0 auto;padding:16px 24px 4px}
.search{display:flex;align-items:center;gap:10px;background:var(--card);border:1.5px solid var(--line);border-radius:13px;padding:11px 13px;box-shadow:var(--sh-sm);transition:.15s}
.search:focus-within{border-color:var(--wind);box-shadow:0 0 0 4px rgba(0,103,172,.14)}
.search input{border:none;outline:none;flex:1;font-size:16px;background:none;color:var(--text);font-weight:500}
.search .sic{color:var(--faint);font-size:16px}
.scanbtn{background:linear-gradient(135deg,var(--safety),var(--safety-d));color:#fff;border:none;border-radius:10px;padding:9px 13px;font-family:var(--cond);font-size:15px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;display:flex;align-items:center;gap:6px;white-space:nowrap;box-shadow:0 3px 10px rgba(232,119,34,.32)}
.scanbtn:active{transform:scale(.96)}

/* ===== content ===== */
.wrap{max-width:1500px;margin:0 auto;padding:16px 24px}
.eyebrow{display:flex;align-items:center;gap:10px;margin:6px 2px 14px}
.eyebrow .tick{width:22px;height:3px;background:var(--safety);flex-shrink:0}
.eyebrow h2{font-family:var(--cond);font-size:20px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--navy);margin:0}
.eyebrow .n{margin-left:auto;font-family:var(--mono);font-size:11.5px;color:var(--muted);letter-spacing:.02em}
.crumbs{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);margin:0 2px 14px;flex-wrap:wrap;font-weight:500}
.crumbs button{background:none;border:none;color:var(--wind);padding:0;font-size:12px;font-weight:600}
.crumbs .sep{color:var(--faint)}
.crumbs b{color:var(--text);font-weight:700}

/* ===== grids/tiles ===== */
.grid{display:grid;gap:12px}
.grid.cust{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
.grid.proj{grid-template-columns:repeat(auto-fill,minmax(236px,1fr))}
.tile{position:relative;background:var(--card);border:1px solid var(--line);border-radius:4px;padding:16px;text-align:left;box-shadow:var(--sh-sm);transition:transform .12s,box-shadow .12s,border-color .12s;overflow:hidden}
.tile::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--wind);opacity:.85}
.tile.cust::before{width:4px;background:linear-gradient(var(--wind),var(--navy))}
.tile::after{content:"";position:absolute;right:9px;top:9px;width:9px;height:9px;border-top:2px solid var(--line);border-right:2px solid var(--line)}
.tile{padding-left:18px}
.tile:active{transform:translateY(1px)}
.tile:hover{box-shadow:var(--sh);border-color:var(--wind)}
.tile .nm{font-weight:700;font-size:15.5px;line-height:1.25;letter-spacing:.01em}
.tile.cust .nm{font-family:var(--cond);font-size:23px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--navy)}
.tile .mt{color:var(--muted);font-size:12.5px;margin-top:6px;display:flex;gap:14px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.tile .mt b{color:var(--navy);font-weight:700}
.tile .go{margin-top:11px;font-family:var(--cond);font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--wind);display:flex;align-items:center;gap:6px}
.tile .go::after{content:"→";color:var(--safety)}
.secs{display:flex;gap:4px;flex-wrap:wrap;margin-top:10px}
.chip{font-family:var(--cond);font-size:12px;font-weight:600;padding:1px 8px;border-radius:3px;background:var(--paper-2);color:var(--navy);letter-spacing:.05em}

/* ===== SECTION screen — tower elevation ===== */
.secwrap{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:start}
.elev{position:sticky;top:150px;background:linear-gradient(160deg,#f5f9fd,#e9f0f8);border:1px solid var(--line);border-radius:8px;padding:14px 10px 10px;box-shadow:var(--sh-sm)}
.elev .cap{font-family:var(--cond);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--wind);text-align:center;margin-bottom:8px;opacity:.85;font-weight:700}
.elev svg{display:block;overflow:visible}
.band{cursor:pointer;transition:.15s}
.band .bg{fill:rgba(0,161,228,.12);stroke:rgba(0,103,172,.55);stroke-width:1}
.band:hover .bg{fill:rgba(0,161,228,.24)}
.band.sel .bg{stroke:var(--safety);stroke-width:2}
.band .lab{fill:var(--navy);font-family:var(--cond);font-weight:700;font-size:11px;letter-spacing:.04em;text-anchor:middle;dominant-baseline:middle;pointer-events:none}
.dimtxt{fill:var(--wind);font-family:var(--mono);font-size:8px;text-anchor:end;opacity:.85}
.dimln{stroke:rgba(0,103,172,.45);stroke-width:.7}

.seccards{display:flex;flex-direction:column;gap:11px;min-width:0}
.seccard{position:relative;background:var(--card);border:1px solid var(--line);border-radius:4px;padding:14px 15px 14px 17px;text-align:left;box-shadow:var(--sh-sm);transition:transform .12s,box-shadow .12s,border-color .12s;overflow:hidden}
.seccard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px}
.seccard.p-top::before{background:linear-gradient(var(--sky),var(--wind))}
.seccard.p-mid::before{background:linear-gradient(var(--wind-2),var(--wind))}
.seccard.p-bot::before{background:linear-gradient(var(--navy),var(--steel-800))}
.seccard:active{transform:translateY(1px)}
.seccard:hover{box-shadow:var(--sh);border-color:var(--wind)}
.seccard.sel{border-color:var(--safety)}
.seccard .row1{display:flex;align-items:baseline;gap:10px}
.seccard .stag{font-family:var(--cond);font-size:25px;font-weight:800;letter-spacing:.03em;color:var(--navy);line-height:.95}
.seccard .slabel{font-size:11.5px;color:var(--muted);font-weight:600}
.seccard .cnt{margin-left:auto;text-align:right;line-height:1}
.seccard .cnt b{font-family:var(--cond);font-size:22px;font-weight:700;color:var(--navy)}
.seccard .cnt span{font-family:var(--cond);font-size:10px;color:var(--faint);text-transform:uppercase;letter-spacing:.08em;display:block;margin-top:1px}
.pbar{height:6px;background:var(--paper-2);border-radius:3px;margin-top:12px;overflow:hidden}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),#12a88d);border-radius:3px;transition:width .4s}
.seccard .pmeta{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:5px;font-variant-numeric:tabular-nums}
.seccard .pmeta b{color:var(--teal)}

/* ===== set list ===== */
.setcard{display:flex;align-items:center;gap:13px;background:var(--card);border:1px solid var(--line);border-radius:4px;padding:12px 14px;margin-bottom:9px;box-shadow:var(--sh-sm);width:100%;text-align:left;transition:transform .1s,box-shadow .12s,border-color .12s}
.setcard:active{transform:translateY(1px)}
.setcard:hover{box-shadow:var(--sh);border-color:var(--wind)}
.setcard .ico{flex-shrink:0;width:44px;height:44px;border-radius:5px;background:var(--paper);border:1px solid var(--line);display:grid;place-items:center;font-family:var(--cond);font-weight:800;font-size:12px;color:var(--wind);letter-spacing:.03em}
.setcard.isset .ico{background:linear-gradient(135deg,#e9f1fa,#dbe7f4);border-color:#cadaec;color:var(--navy)}
.setcard .info{flex:1;min-width:0}
.setcard .code{font-family:var(--mono);font-weight:600;font-size:13px;display:flex;align-items:center;gap:7px}
.setcard .desc{color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.tag{font-family:var(--cond);font-size:11px;font-weight:700;letter-spacing:.06em;padding:0 6px;border-radius:3px;background:var(--navy);color:#fff}
.stock{text-align:right;flex-shrink:0}
.stock .n{font-family:var(--cond);font-size:26px;font-weight:700;line-height:.9;font-variant-numeric:tabular-nums}
.stock.pos .n{color:var(--teal)} .stock.zero .n{color:#c2ccda}
.stock .l{font-family:var(--cond);font-size:10px;color:var(--faint);text-transform:uppercase;letter-spacing:.08em;margin-top:2px}

.empty{text-align:center;color:var(--muted);padding:56px 20px}
.empty .big{font-size:46px;opacity:.3;margin-bottom:8px}

/* (điều hướng đã chuyển lên thanh trên cùng) */




/* ===== bảng tồn kho theo cây ===== */
.stkbar{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.stkbar .fl{font-family:var(--cond);font-size:13px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-right:2px}
.stkf{font-family:var(--cond);font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
  padding:8px 14px;border:1px solid var(--line);background:#fff;color:var(--muted);border-radius:7px}
.stkf.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.stkf:hover{border-color:var(--navy)}
.stktbl{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:8px;overflow:hidden;box-shadow:var(--sh-sm)}
.stktbl th{background:var(--navy);color:#fff;font-family:var(--cond);font-size:13px;letter-spacing:.05em;
  text-transform:uppercase;text-align:left;padding:11px 14px;font-weight:700}
.stktbl th.r,.stktbl td.r{text-align:right}
.stktbl td{padding:9px 14px;border-bottom:1px solid var(--line-2);font-size:13.5px;vertical-align:middle}
.stktbl tr[data-k]{cursor:pointer}
.stktbl tr.lv1 td{background:var(--sky-l);font-size:14px}
.stktbl tr.lv1:hover td{background:#d8ecf9}
.stktbl tr.lv1 b{font-family:var(--cond);font-size:18px;letter-spacing:.04em;text-transform:uppercase;color:var(--navy)}
.stktbl tr.lv2 td:first-child{padding-left:34px}
.stktbl tr.lv2:hover td{background:#fbfdff}
.stktbl tr.lv3 td:first-child{padding-left:58px}
.stktbl tr.lv3 td{background:#fcfdff;font-size:13px}
.stktbl .caret{display:inline-block;width:16px;color:var(--wind);font-size:11px}
.stktbl .sub{color:var(--faint);font-size:11.5px;font-weight:400}
.stktbl .num{font-variant-numeric:tabular-nums;font-weight:600;color:var(--muted)}
.stktbl .num.pos{color:var(--teal)}
.stktbl .num.big{font-family:var(--cond);font-size:18px;font-weight:800}
.stktbl .secn{font-family:var(--cond);font-size:15px;letter-spacing:.05em;color:var(--navy)}
.stktbl .secdot{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:8px;vertical-align:middle}
.stktbl .secdot.top{background:var(--wind-2)} .stktbl .secdot.mid{background:var(--wind)} .stktbl .secdot.bot{background:var(--navy)}
.stktbl tfoot td{background:var(--paper-2);font-weight:700;border-top:2px solid var(--navy);border-bottom:none;color:var(--navy)}
.barpct{font-size:10.5px;color:var(--muted);text-align:right;margin-top:2px;font-variant-numeric:tabular-nums}
@media(max-width:640px){ .stktbl th:nth-child(4),.stktbl td:nth-child(4){display:none} }


/* ===== lịch sử yêu cầu của IM: gom theo ngày + section ===== */
.histday{background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:var(--sh-sm);margin-bottom:11px;overflow:hidden}
.histday-h{display:flex;align-items:baseline;gap:10px;padding:11px 14px;background:var(--sky-l);border-bottom:1px solid var(--line-2)}
.histday-h b{font-family:var(--cond);font-size:16px;letter-spacing:.03em;color:var(--navy)}
.histday-h .sub{font-size:12px;color:var(--muted)}
.histsecs{display:flex;flex-wrap:wrap;gap:8px;padding:12px 14px}
.histchip{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:6px 13px;font-size:12.5px;color:var(--text)}
.histchip b{font-family:var(--cond);font-size:14px;letter-spacing:.03em;color:var(--wind);margin-right:2px}

/* ===== vai trò & phiếu yêu cầu ===== */

.syncbtn{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);color:#fff;font-family:var(--cond);
  font-size:13px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:7px 11px;border-radius:8px;white-space:nowrap;flex-shrink:0;margin-right:6px}
.syncbtn:active{background:rgba(255,255,255,.3)}
.syncbtn.okc{border-color:rgba(120,255,200,.5)}
.syncbtn.errc{border-color:rgba(255,170,120,.7);color:#ffd9b3}
#roleShort{display:none}
@media(max-width:760px){
  .syncbtn .sl{display:none}
  .rolebtn{display:inline-flex;padding:7px 10px}
  #roleTxt{display:none} #roleShort{display:inline}
  .topin{gap:8px;padding:0 10px}
  .brand .bt .n{font-size:16px}
  .nav button{padding:0 11px;font-size:14px}
}
@media(max-width:430px){
  .brand .bt{display:none}          /* màn rất hẹp: chỉ giữ logo cho gọn */
  .mk{padding:0 8px}
}
.rolebtn{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);color:#fff;font-family:var(--cond);
  font-size:13px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:7px 12px;border-radius:8px;white-space:nowrap;flex-shrink:0}
.rolebtn:active{background:rgba(255,255,255,.3)}
.rolegrid{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.rolecard{display:flex;align-items:center;gap:14px;padding:15px;border:1.5px solid var(--line);border-radius:10px;background:#fff;text-align:left;transition:.12s}
.rolecard:hover{border-color:var(--wind);box-shadow:var(--sh-sm)}
.rolecard .rt{font-family:var(--cond);font-size:24px;font-weight:800;color:var(--navy);min-width:56px;text-align:center;
  background:var(--sky-l);border-radius:8px;padding:8px 4px;letter-spacing:.04em}
.rolecard.kho .rt{background:var(--navy);color:#fff}
.rolecard .rd{font-size:13px;color:var(--muted);line-height:1.45}
.rolecard .rd b{color:var(--navy)}
.mini.req{background:var(--safety)}
.acts .req{background:linear-gradient(135deg,var(--safety),var(--safety-d))}
.modetag.req{background:#fff4ea;color:var(--safety-d);border:1px solid #f3d5b5}
.prbtn{border:1.5px solid var(--safety);background:#fff8f2;color:var(--safety-d);font-family:var(--cond);font-size:13px;font-weight:700;
  letter-spacing:.03em;text-transform:uppercase;padding:7px 11px;border-radius:7px;flex-shrink:0;white-space:nowrap;margin-right:6px}
.prbtn:hover{background:#fdecdd}
.prbtn:active{transform:translateY(1px)}
.stpill{font-family:var(--cond);font-size:12px;font-weight:700;letter-spacing:.03em;padding:3px 10px;border-radius:20px;white-space:nowrap}
.stpill.wait{background:#fff4ea;color:var(--safety-d)}
.stpill.done{background:#e3f5f1;color:#0b6d5c}
.stpill.lack{background:#fdeeea;color:var(--rust)}
.reqcard{background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:var(--sh-sm);margin-bottom:12px;overflow:hidden}
.rq1{display:flex;align-items:center;gap:11px;padding:12px 14px;border-bottom:1px solid var(--line-2)}
.rqnote{padding:8px 14px;background:#fff8f2;font-size:12.5px;color:var(--safety-d);border-bottom:1px solid var(--line-2)}
.rqtbl{width:100%;border-collapse:collapse;font-size:12.5px}
.rqtbl th{background:var(--sky-l);color:var(--navy);font-family:var(--cond);font-size:12px;letter-spacing:.04em;
  text-transform:uppercase;text-align:left;padding:7px 10px;border-bottom:1px solid var(--line)}
.rqtbl td{padding:7px 10px;border-bottom:1px solid var(--line-2)}
.rqtbl .r{text-align:right} .rqtbl .mono{font-family:var(--mono);font-size:12px}
.rqtbl tr:last-child td{border-bottom:none}

/* ===== thao tác dự án ===== */
.projacts{display:flex;gap:10px;margin:-6px 0 16px;flex-wrap:wrap}
.pact{font-family:var(--cond);font-size:14px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
  padding:10px 16px;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--navy);box-shadow:var(--sh-sm);transition:.12s}

<script>
const DATA=[];   // Không nhúng dữ liệu mẫu — chỉ nhận dự án khi Kho nạp BOM hoặc đồng bộ với Google Sheet.
const LS='mc_pro2_tx_v1', LS_CART='mc_pro2_cart', LS_CFG='mc_pro2_cfg', LS_ROLE='mc_pro2_role';
const DEFAULT_PASS='cswind';
// Địa chỉ Apps Script của CS Wind — nhúng sẵn để mở file là dùng được ngay
const DEFAULT_URL='https://script.google.com/macros/s/AKfycbzftpilvzi6rrNrggaRCwn-Bf3jehEIShB9J9OeCg7CKFCqgJ9i2vc3Em6UTbMqQ1O0/exec';
// vai trò: 'IM' (bộ phận yêu cầu vật tư) | 'KHO' (kho xử lý)
let ROLE=(function(){ try{ return localStorage.getItem(LS_ROLE)||'' }catch(e){ return '' } })();
function saveRole(){ try{ localStorage.setItem(LS_ROLE,ROLE) }catch(e){} }
const isKho=()=>ROLE==='KHO';
const roleName=r=>r==='KHO'?'Kho v&#7853;t t&#432;':'B&#7897; ph&#7853;n IM';
let TX=load();
let CART=loadCart();
let CFG=loadCfg();
function load(){ try{ return JSON.parse(localStorage.getItem(LS))||[] }catch(e){ return [] } }
function save(){ try{ localStorage.setItem(LS,JSON.stringify(TX)) }catch(e){} }
function loadCart(){ try{ return JSON.parse(localStorage.getItem(LS_CART))||[] }catch(e){ return [] } }
function saveCart(){ try{ localStorage.setItem(LS_CART,JSON.stringify(CART)) }catch(e){}; updateBadge(); }
function loadCfg(){
  let c;
  try{ c=JSON.parse(localStorage.getItem(LS_CFG))||{}; }catch(e){ c={}; }
  if(!c.url) c.url=DEFAULT_URL;          // tự điền địa chỉ mặc định
  if(!c.token) c.token='im';
  if(!c.pass) c.pass=DEFAULT_PASS;
  if(c.orderer===undefined) c.orderer='';
  return c;
}
function saveCfg(){ try{ localStorage.setItem(LS_CFG,JSON.stringify(CFG)) }catch(e){} }
function updateBadge(){ const b=document.getElementById('cartBadge'); if(!b)return; const n=CART.length; b.textContent=n; b.className='cartbadge'+(n?' show':''); }

const LS_ORD='mc_pro2_orders', LS_UP='mc_pro2_userproj';
let ORDERS=(function(){ try{ return JSON.parse(localStorage.getItem(LS_ORD))||[] }catch(e){ return [] } })();
function saveOrders(){ try{ localStorage.setItem(LS_ORD,JSON.stringify(ORDERS)) }catch(e){}; updateBadge(); }
let USERPROJ=(function(){ try{ return JSON.parse(localStorage.getItem(LS_UP))||[] }catch(e){ return [] } })();
function saveUserProj(){ try{ localStorage.setItem(LS_UP,JSON.stringify(USERPROJ)) }catch(e){} }
// Danh mục dự án tải về TỪ GOOGLE SHEET — đây là nguồn dữ liệu chuẩn duy nhất.
// App không nhúng dữ liệu mẫu; dự án chỉ xuất hiện khi Kho tự nạp BOM
// (USERPROJ, đẩy lên Sheet ngay) hoặc khi đồng bộ nhận về từ Sheet (SHEETPROJ).
const LS_SP='mc_pro2_sheetproj';
let SHEETPROJ=(function(){ try{ return JSON.parse(localStorage.getItem(LS_SP))||[] }catch(e){ return [] } })();
function saveSheetProj(){ try{ localStorage.setItem(LS_SP,JSON.stringify(SHEETPROJ)) }catch(e){} }

const LS_DEL='mc_pro2_deleted';
let DELETED=(function(){ try{ return JSON.parse(localStorage.getItem(LS_DEL))||[] }catch(e){ return [] } })();
function saveDeleted(){ try{ localStorage.setItem(LS_DEL,JSON.stringify(DELETED)) }catch(e){} }
// Khoá dự án: Khách hàng || Dự án || IM
const pkeyOf=(cu,pj,dp)=>cu+'||'+pj+'||'+(dp||'IM');

const ITEMS=[],PROJECTS=[];
// Nguồn dự án: chỉ Sheet (SHEETPROJ) + dự án Kho vừa tự nạp (USERPROJ) — không có dữ liệu mẫu.
const ALLRAW = SHEETPROJ.concat(USERPROJ);
const ALLDATA=ALLRAW.filter(p=>!DELETED.includes(pkeyOf(p.cu,p.pj,p.dp)));
ALLDATA.forEach((p,pi)=>{ const dp=p.dp||'IM', key=pkeyOf(p.cu,p.pj,dp);
  const proj={customer:p.cu,project:p.pj,towers:p.tw,dept:dp,pid:pi,pkey:key,items:[],isUser:!!p.user};
  p.it.forEach(r=>{ const it={code:r.c,desc:r.d,unit:r.u,section:(r.s||'').toUpperCase(),
    customer:p.cu,project:p.pj,dept:dp,pid:pi,pkey:key}; ITEMS.push(it); proj.items.push(it); });
  PROJECTS.push(proj); });

// dự án mà vai trò hiện tại được phép thấy (Kho thấy tất cả)
function myProjects(){ return isKho()? PROJECTS : PROJECTS.filter(p=>p.dept===ROLE); }
function myCustomers(){ return [...new Set(myProjects().map(p=>p.customer))]; }
const CUSTOMERS=[...new Set(ALLDATA.map(p=>p.cu))];

// chuyển giao dịch cũ (khoá theo chỉ số) sang khoá ổn định — chạy một lần
const itemKey=it=>(it.pkey||pkeyOf(it.customer,it.project,it.dept))+'|'+it.code;
/* ---- CHỈ MỤC TỒN KHO: tra cứu tức thời thay vì quét lại toàn bộ giao dịch ---- */
let IDX=null;                       // Map: khoá mã -> {in, out}
let IDXPRJ=null;                    // Map: khoá dự án -> {in, out, codes:Set}
function idxBuild(){
  IDX=new Map(); IDXPRJ=new Map();
  for(const t of TX) idxAdd(t);
}
function idxAdd(t){
  if(!IDX) return;
  let e=IDX.get(t.k); if(!e){ e={in:0,out:0}; IDX.set(t.k,e); }
  let p=IDXPRJ.get(t.pk); if(!p){ p={in:0,out:0}; IDXPRJ.set(t.pk,p); }
  if(t.type==='in'){ e.in+=t.qty; p.in+=t.qty; } else { e.out+=t.qty; p.out+=t.qty; }
}
function idxOf(it){ if(!IDX) idxBuild(); return IDX.get(itemKey(it))||{in:0,out:0}; }
function stockOf(it){ const e=idxOf(it); return e.in-e.out; }
function recvOf(it){ return idxOf(it).in; }

(function migrateTX(){
  let changed=false;
  TX.forEach(t=>{
    if(!t.pk){
      const m=String(t.k||'').match(/^(\d+)\|(.*)$/);
      if(m){ const p=PROJECTS[+m[1]]; if(p){ t.pk=p.pkey; t.k=p.pkey+'|'+m[2]; changed=true; } }
    }
    // khoá cũ chỉ có "KH||Dự án" -> gán về bộ phận IM
    if(t.pk && t.pk.split('||').length===2){
      const code=String(t.k||'').slice(t.pk.length+1);
      t.pk=t.pk+'||IM'; t.k=t.pk+'|'+code; changed=true;
    }
  });
  ORDERS.forEach(o=>{ if(o.pkey && o.pkey.split('||').length===2){ o.pkey=o.pkey+'||'+(o.dept||'IM'); } });
  saveOrders();
  if(changed) save();
  idxBuild();
})();
const projOf=pid=>PROJECTS[pid];
function movesOf(it){ const k=itemKey(it); return TX.filter(t=>t.k===k).sort((a,b)=>b.ts-a.ts); }
// thống kê 1 dự án: nhu cầu = số mã × số tháp (mỗi mã 1/tháp); tháp về = TB số đã nhận / mã
function projStat(p){
  const codes=p.items.length, tw=p.towers||1, demand=codes*tw;
  if(!IDX) idxBuild();
  const agg=IDXPRJ.get(p.pkey)||{in:0,out:0};
  let recv=agg.in, inStock=agg.in-agg.out, started=0;
  p.items.forEach(it=>{ if(idxOf(it).in>0) started++; });
  const pct=demand?Math.min(100,recv/demand*100):0;
  const towersDone=codes?recv/codes:0;   // quy đổi số tháp về được
  return {codes,tw,demand,recv,inStock,started,pct,towersDone};
}
function pendingOrders(){ return ORDERS.filter(o=>o.status==='pending'); }

function secRank(s){ s=(s||'').toUpperCase();
  if(/^TOP/.test(s))return 0; if(/^BOT/.test(s))return 9000;
  const m=s.match(/(\d+)/),n=m?+m[1]:50;
  if(/^(MID|M)/.test(s))return 1000+n; if(/^S/.test(s))return 5000-n; return 500+n; }
function secPos(s){ s=(s||'').toUpperCase(); if(/^TOP/.test(s))return 'top'; if(/^BOT/.test(s))return 'bot'; return 'mid'; }
function secLabel(s){ s=(s||'').toUpperCase(); const m=s.match(/(\d+)/);
  if(/^TOP/.test(s))return 'Top Section';
  if(/^BOT/.test(s))return 'Bottom Section';
  if(/^(MID|M)/.test(s))return 'Middle Section'+(m?' '+m[1]:'');
  if(/^S/.test(s))return 'Section '+(m?m[1]:''); return 'Section'; }
function sectionsOf(proj){ const map=new Map();
  proj.items.forEach(it=>{ const s=it.section||'(CHUNG)'; if(!map.has(s))map.set(s,[]); map.get(s).push(it); });
  return [...map.entries()].map(([s,items])=>({s,items})).sort((a,b)=>secRank(a.s)-secRank(b.s)); }

let tab='dash',cust=null,pid=null,sect=null,query='';
const $=s=>document.querySelector(s);
const view=$('#view');
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function nfm(n){ return (Math.round(n)||0).toLocaleString('vi-VN'); }

function render(){
  if(tab==='stock'){ renderStock(); return; }
  if(tab==='dash'){ renderDash(); return; }
  if(tab==='order'){ renderOrder(); return; }
  if(tab==='hist'){ renderHist(); return; }
  const q=query.trim().toLowerCase();
  if(q){ renderSearch(q); return; }
  if(pid!=null&&sect!=null){ renderSets(); return; }
  if(pid!=null){ renderSections(); return; }
  if(cust){ renderProjects(); return; }
  renderCustomers();
}
let curCrumb=[];
function crumb(parts,last){ curCrumb=parts;
  return '<div class="crumbs">'+parts.map((p,i)=>'<button data-ci="'+i+'">'+p[0]+'</button><span class="sep">/</span>').join('')+'<b>'+esc(last)+'</b></div>'; }
document.addEventListener('click',e=>{ const c=e.target.closest('.crumbs button'); if(c&&curCrumb[+c.dataset.ci]) curCrumb[+c.dataset.ci][1](); });

// thanh tiêu đề trang có nút QUAY LẠI
let backFn=null;
function pagehead(title, meta, back){
  backFn=back||null;
  return '<div class="phead">'
    +(back?'<button class="backbtn" id="backBtn">&#8592; Quay l&#7841;i</button>':'')
    +'<div class="ptitle"><span class="tick"></span><h2>'+title+'</h2></div>'
    +(meta?'<span class="pmetan">'+meta+'</span>':'')
    +'</div>';
}
document.addEventListener('click',e=>{ if(e.target.closest('#backBtn')&&backFn) backFn(); });

function renderCustomers(){
  let MP=myProjects();
  const MC=[...new Set(MP.map(p=>p.customer))];
  view.innerHTML=pagehead((isKho()?'Nh&#7853;p/Xu&#7845;t v&#7853;t t&#432;':'Tra c&#7913;u v&#7853;t t&#432; ('+ROLE+')')+' &#8212; ch&#7885;n khách hàng',
      MC.length+' khách hàng &#183; '+MP.length+' d&#7921; án'+(isKho()?'':' c&#7911;a '+ROLE), null)
    +(isKho()
      ? '<div class="stkbar"><div class="grow"></div>'
        +'<button class="stkf" id="newBom">&#10133; T&#7841;o BOM d&#7921; án m&#7899;i</button></div>'
      : '')
    +'<div class="grid cust" id="g"></div>';
  const nb=$('#newBom'); if(nb) nb.onclick=openBomForm;
  const g=$('#g');
  if(!MC.length){ g.innerHTML= isKho()
      ? '<div class="empty"><div class="big">&#128230;</div>Ch&#432;a có danh m&#7909;c v&#7853;t t&#432; nào.<br>B&#7845;m <b>&#10133; T&#7841;o BOM d&#7921; án m&#7899;i</b> &#273;&#7875; n&#7841;p t&#7915; file Excel.</div>'
      : '<div class="empty"><div class="big">&#128230;</div>Kho ch&#432;a n&#7841;p danh m&#7909;c v&#7853;t t&#432; cho b&#7897; ph&#7853;n <b>'+ROLE+'</b>.<br>Liên h&#7879; kho &#273;&#7875; n&#7841;p BOM d&#7921; án tr&#432;&#7899;c khi t&#7841;o yêu c&#7847;u.</div>'; }
  MC.forEach(c=>{
    const projs=MP.filter(p=>p.customer===c);
    let dem=0,rec=0; projs.forEach(p=>{const s=projStat(p); dem+=s.demand; rec+=s.recv;});
    const pct=dem?Math.round(rec/dem*100):0;
    const b=document.createElement('button'); b.className='tile cust';
    b.innerHTML='<div class="nm">'+esc(c)+'</div><div class="mt"><span><b>'+projs.length+'</b> d&#7921; án</span><span><b>'+pct+'%</b> &#273;&#7841;t</span></div>'
      +'<div class="minibar"><i style="width:'+pct+'%"></i></div><div class="go">Xem d&#7921; án</div>';
    b.onclick=()=>{cust=c;render();}; g.appendChild(b); });
}
function renderProjects(){
  const projs=myProjects().filter(p=>p.customer===cust);
  view.innerHTML=pagehead(esc(cust), projs.length+' d&#7921; án', ()=>{cust=null;render();})
    +'<div class="grid proj" id="g"></div>';
  const g=$('#g');
  projs.forEach(p=>{ const secs=sectionsOf(p), st=projStat(p);
    const b=document.createElement('button'); b.className='tile';
    b.innerHTML='<div class="nm">'+esc(p.project)+'</div>'
      +'<div class="mt"><span><b>'+p.towers+'</b> tháp</span><span><b>'+p.items.length+'</b> set</span><span><b>'+secs.length+'</b> section</span></div>'
      +'<div class="minibar"><i style="width:'+Math.round(st.pct)+'%"></i></div>'
      +'<div class="mt" style="margin-top:5px"><span style="color:var(--teal);font-weight:700">'+Math.round(st.pct)+'% &#273;&#7841;t</span><span>t&#7891;n '+nfm(st.inStock)+'</span></div>'
      +'<div class="secs">'+secs.slice(0,7).map(x=>'<span class="chip">'+esc(x.s)+'</span>').join('')+'</div>'
      +'<div class="go">Ch&#7885;n section</div>';
    b.onclick=()=>{pid=p.pid;render();}; g.appendChild(b); });
}

function buildElevation(secs, sel){
  const n=secs.length, bw=200, topHalf=24, botHalf=58, bandH=Math.max(30,Math.min(48,300/n)), gap=3;
  const cx=92, top=16, H=top + n*(bandH+gap) + 20;
  const halfAt=y=>topHalf+(botHalf-topHalf)*((y-top)/(n*(bandH+gap)));
  let parts='<defs><linearGradient id="fillg" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#12a88d"/><stop offset="1" stop-color="#0e8f78"/></linearGradient></defs>';
  // nacelle + blades at very top
  parts+='<g transform="translate('+cx+','+(top-6)+')"><circle r="3" fill="#E87722"/><path d="M0 0 L0 -8 M0 0 L6 3.5 M0 0 L-6 3.5" stroke="#E87722" stroke-width="1.4" stroke-linecap="round"/></g>';
  secs.forEach((x,i)=>{
    const y0=top+i*(bandH+gap), y1=y0+bandH, h0=halfAt(y0), h1=halfAt(y1), my=(y0+y1)/2;
    const total=x.items.length, started=x.items.filter(it=>stockOf(it)>0).length, pct=total?started/total:0;
    const isSel=x.s===sel;
    // trapezoid path
    const p=`M${cx-h0} ${y0} L${cx+h0} ${y0} L${cx+h1} ${y1} L${cx-h1} ${y1} Z`;
    // progress fill height from bottom
    const fy=y1-(y1-y0)*pct;
    parts+='<g class="band'+(isSel?' sel':'')+'" data-s="'+esc(x.s)+'">';
    parts+='<path class="bg" d="'+p+'"/>';
    if(pct>0){ parts+='<clipPath id="c'+i+'"><path d="'+p+'"/></clipPath>';
      parts+='<rect x="'+(cx-botHalf)+'" y="'+fy+'" width="'+(botHalf*2)+'" height="'+(y1-fy)+'" fill="url(#fillg)" opacity=".7" clip-path="url(#c'+i+')"/>'; }
    parts+='<text class="lab" x="'+cx+'" y="'+my+'">'+esc(x.s)+'</text>';
    // dimension tick + count on right
    parts+='<line class="dimln" x1="'+(cx+botHalf+6)+'" y1="'+y0+'" x2="'+(cx+botHalf+6)+'" y2="'+y1+'"/>';
    parts+='<text class="dimtxt" x="'+(cx+botHalf+2)+'" y="'+(my+3)+'" text-anchor="start" style="fill:#0067AC;opacity:.9">'+total+'</text>';
    parts+='</g>';
  });
  // base
  parts+='<rect x="'+(cx-botHalf-4)+'" y="'+(top+n*(bandH+gap)+2)+'" width="'+((botHalf+4)*2)+'" height="7" rx="2" fill="#0067AC" opacity=".38"/>';
  return '<div class="cap">Elevation</div><svg viewBox="0 0 '+bw+' '+H+'" width="118">'+parts+'</svg>';
}

function renderSections(){
  const p=projOf(pid), secs=sectionsOf(p), st=projStat(p);
  view.innerHTML=pagehead(esc(p.project),
      esc(p.customer)+' &#183; '+p.towers+' tháp &#183; '+Math.round(st.pct)+'% &#273;&#7841;t',
      ()=>{pid=null;render();})
    +'<div class="projacts">'
      +'<button class="pact xls" id="pXls">&#128202; Xu&#7845;t Excel (nh&#7853;p &amp; xu&#7845;t)</button>'
      +'<button class="pact del" id="pDel">&#128465; Xoá d&#7921; án &#273;ã k&#7871;t thúc</button>'
    +'</div>'
    +'<div class="secwrap"><div class="elev" id="elev"></div><div class="seccards" id="sc"></div></div>';
  $('#pXls').onclick=()=>exportProjectExcel(p);
  $('#pDel').onclick=()=>deleteProject(p);
  $('#elev').innerHTML=buildElevation(secs,null);
  $('#elev').querySelectorAll('.band').forEach(b=>b.onclick=()=>{ sect=b.dataset.s; render(); });
  const sc=$('#sc');
  secs.forEach(x=>{ const total=x.items.length, started=x.items.filter(it=>stockOf(it)>0).length, pct=total?Math.round(started/total*100):0;
    const onhand=x.items.reduce((n,it)=>n+stockOf(it),0);
    const doan=doanLapDuoc(x.items);           // lắp được bao nhiêu đoạn với tồn hiện có
    const b=document.createElement('div'); b.className='seccard p-'+secPos(x.s);
    b.innerHTML='<div class="row1 open" data-open="1"><div><div class="stag">'+esc(x.s)+'</div><div class="slabel">'+secLabel(x.s)+'</div></div>'
      +'<div class="cnt"><b>'+doan+'</b><span>section s&#7861;n sàng</span></div></div>'
      +'<div class="pbar" data-open="1"><i style="width:'+pct+'%"></i></div>'
      +'<div class="pmeta" data-open="1"><span><b>'+started+'</b>/'+total+' mã có hàng &#183; t&#7891;n '+nfm(onhand)+'</span><span>'+pct+'%</span></div>'
      +'<div class="secacts">'
        +(isKho()
          ? '<button class="mini in" data-act="in">&#9660; Nh&#7853;p theo Section</button>'
            +'<button class="mini out" data-act="out"'+(doan<1?' disabled':'')+'>&#9650; Xu&#7845;t theo Section</button>'
          : '<button class="mini req" data-act="req">&#43; S&#7889; l&#432;&#7907;ng Section yêu c&#7847;u</button>')
        +'<button class="mini ghost" data-open="1">Xem t&#7915;ng mã &#8594;</button>'
      +'</div>';
    b.querySelectorAll('[data-open]').forEach(el=>el.onclick=()=>{sect=x.s;render();});
    b.querySelectorAll('[data-act]').forEach(el=>el.onclick=e=>{ e.stopPropagation(); openSectionSheet(p,x,el.dataset.act); });
    sc.appendChild(b); });
}

/* ===== THAO TÁC THEO CẢ ĐOẠN: 1 đoạn = trọn bộ mã của section đó ===== */
// mỗi mã cần bao nhiêu cho 1 đoạn (mặc định 1; dự phòng cho BOM có định mức)
function perDoan(it){ return Math.max(1, +it.qty || 1); }
// với tồn hiện có thì lắp trọn được bao nhiêu đoạn (điểm nghẽn = mã thiếu nhất)
function doanLapDuoc(items){
  if(!items.length) return 0;
  let min=Infinity;
  items.forEach(it=>{ min=Math.min(min, Math.floor(stockOf(it)/perDoan(it))); });
  return min===Infinity?0:min;
}
function openSectionSheet(p,x,mode){
  const sec=x.s, items=x.items;
  let n=1;
  const draw=()=>{
    const rows=items.map(it=>{ const need=perDoan(it)*n, on=stockOf(it);
      return {it,need,on,ok:on>=need}; });
    const thieu=rows.filter(r=>!r.ok);
    const tag = mode==='in' ? '<div class="modetag in">&#9660; NH&#7852;P KHO theo section &#8212; c&#7897;ng vào t&#7891;n t&#7845;t c&#7843; mã c&#7911;a section</div>'
              : mode==='out'? '<div class="modetag out">&#9650; XU&#7844;T KHO theo section &#8212; tr&#7915; t&#7891;n t&#7845;t c&#7843; mã c&#7911;a section</div>'
              : '<div class="modetag req">&#43; YÊU C&#7846;U theo section &#8212; g&#7917;i sang kho c&#7845;p phát</div>';
    const btn = mode==='in' ? '<button class="in" id="secGo">&#9660; Nh&#7853;p '+n+' section '+esc(sec)+'<small>'+items.length+' mã</small></button>'

      +'<div class="tw" style="max-height:230px;overflow:auto"><table class="rqtbl"><thead><tr>'
        +'<th>Mã v&#7853;t t&#432;</th><th class="r">C&#7847;n</th><th class="r">T&#7891;n</th><th>Tình tr&#7841;ng</th></tr></thead><tbody>'
      +rows.map(r=>'<tr><td class="mono">'+esc(r.it.code)+'</td><td class="r"><b>'+r.need+'</b></td>'
        +'<td class="r">'+r.on+'</td><td>'+(mode==='in'?'<span class="stpill done">nh&#7853;p thêm</span>'
        :(r.ok?'<span class="stpill done">&#273;&#7911;</span>':'<span class="stpill lack">thi&#7871;u '+(r.need-r.on)+'</span>'))+'</td></tr>').join('')
      +'</tbody></table></div>'

function applySection(p,x,mode,n){
  const items=x.items;
  if(mode==='req'){
    let add=0;
    items.forEach(it=>{ const q=perDoan(it)*n, k=itemKey(it), ex=CART.find(c=>c.k===k);
      if(ex) ex.qty+=q; else CART.push({k,pid:it.pid,code:it.code,desc:it.desc,unit:it.unit,section:it.section,
        customer:it.customer,project:it.project,dept:it.dept,qty:q});
      add++; });
    saveCart(); closeSheet();
    toast('&#43; &#272;ã thêm '+add+' mã ('+n+' section '+esc(x.s)+') vào phi&#7871;u yêu c&#7847;u',false,true);
    return;
  }
  // kho nhập / xuất trọn đoạn
  if(mode==='out'){
    const thieu=items.filter(it=>stockOf(it)<perDoan(it)*n);
    if(thieu.length){ toast('Không &#273;&#7911; t&#7891;n &#8212; '+thieu.length+' mã thi&#7871;u',true); return; }
  }
  if(!confirm(decodeEnt((mode==='in'?'Nh&#7853;p':'Xu&#7845;t')+' '+n+' section '+x.s+' ('+items.length+' mã)?'))) return;
  let cnt=0;
  items.forEach(it=>{ const q=perDoan(it)*n;
    const rec={k:itemKey(it),pk:it.pkey,code:it.code,pid:it.pid,type:mode,qty:q,ts:Date.now(),
      uid:'t'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),by:(CFG.orderer||ROLE)};
    TX.push(rec); idxAdd(rec); cnt++;
    apiFire({action:'tx',tx:rec,customer:it.customer,project:it.project,section:it.section,desc:it.desc,unit:it.unit});
  });
  save(); closeSheet();
  toast((mode==='in'?'&#9660; &#272;ã nh&#7853;p ':'&#9650; &#272;ã xu&#7845;t ')+n+' section '+esc(x.s)+' &#183; '+cnt+' mã',false,true);
  render();
}

// ---- IM: lịch sử YÊU CẦU, tóm gọn theo ngày — bao nhiêu loại section, không liệt kê từng mã ----
function renderHistIM(){
  const mine=ORDERS.filter(o=>o.dept===ROLE || !o.dept).sort((a,b)=>b.ts-a.ts);
  view.innerHTML=pagehead('L&#7883;ch s&#7917; yêu c&#7847;u', mine.length+' y&#234;u c&#7847;u &#273;ã g&#7917;i', null)+'<div id="h"></div>';
  const h=$('#h');
  if(!mine.length){ h.innerHTML='<div class="empty"><div class="big">&#9776;</div>Ch&#432;a g&#7917;i yêu c&#7847;u nào.</div>'; return; }

  // gom theo ngày
  const days=new Map();
  mine.forEach(o=>{ const d=dOnlyLocal(o.ts); if(!days.has(d)) days.set(d,[]); days.get(d).push(o); });

  [...days.entries()].forEach(([day,orders])=>{
    const block=document.createElement('div'); block.className='histday';
    // gom theo section trong ngày: section -> {soLan, soMa, tongSL}
    const bySec=new Map();
    orders.forEach(o=>{
      (o.lines||[]).forEach(l=>{
        const k=l.section||'(chung)';
        if(!bySec.has(k)) bySec.set(k,{sec:k,soLan:new Set(),soMa:0,tongSL:0});
        const g=bySec.get(k); g.soLan.add(o.id); g.soMa++; g.tongSL+=(+l.qty||0);
      });
    });
    const secArr=[...bySec.values()].sort((a,b)=>secRank(a.sec)-secRank(b.sec));
    const daDuyet=orders.filter(o=>o.status==='issued').length;

    block.innerHTML='<div class="histday-h"><b>'+day+'</b><span class="sub">'+orders.length+' y&#234;u c&#7847;u &#183; '+daDuyet+' &#273;ã c&#7845;p phát</span></div>'
      +'<div class="histsecs">'+secArr.map(g=>
        '<span class="histchip"><b>'+esc(g.sec)+'</b> &#183; '+g.soLan.size+' l&#432;&#7907;t &#183; '+g.tongSL+' &#273;/v</span>'
      ).join('')+'</div>';
    h.appendChild(block);
  });
}
function dOnlyLocal(ts){ const d=new Date(ts),z=n=>String(n).padStart(2,'0'); return z(d.getDate())+'/'+z(d.getMonth()+1)+'/'+d.getFullYear(); }
function fmtTime(ts){ const d=new Date(ts),p=n=>String(n).padStart(2,'0'); return p(d.getDate())+'/'+p(d.getMonth()+1)+' '+p(d.getHours())+':'+p(d.getMinutes()); }

// ===== TỒN KHO: Khách hàng → Dự án → Section =====
const stOpen={};   // trạng thái mở/gập
function stockOfProject(p){
  let on=0, codes=0;
  p.items.forEach(it=>{ const s=stockOf(it); on+=s; if(s>0)codes++; });
  return {on,codes,total:p.items.length};
}
function stockOfSection(p,sec){
  let on=0, codes=0, total=0;
  p.items.forEach(it=>{ if((it.section||'(CHUNG)')!==sec) return; total++;
    const s=stockOf(it); on+=s; if(s>0)codes++; });
  return {on,codes,total};
}
function renderStock(){
  const onlyStock=stOpen.__filter===true;
  let gTot=0, gCodes=0, gItems=0;
  myProjects().forEach(p=>{ const s=stockOfProject(p); gTot+=s.on; gCodes+=s.codes; gItems+=s.total; });
  let h=pagehead('T&#7891;n kho theo khách hàng &#183; d&#7921; án &#183; section',
      nfm(gTot)+' &#273;VT &#183; '+gCodes+' mã có hàng', null)
    +'<div class="stkbar">'
      +'<button class="stkf'+(onlyStock?'':' on')+'" data-f="all">T&#7845;t c&#7843;</button>'
      +'<button class="stkf'+(onlyStock?' on':'')+'" data-f="have">Ch&#7881; m&#7909;c còn hàng</button>'
      +'<div class="grow"></div>'
      +'<button class="stkf" data-x="open">M&#7903; t&#7845;t c&#7843;</button>'
      +'<button class="stkf" data-x="close">Thu g&#7885;n</button>'
    +'</div>';

  h+='<table class="stktbl"><thead><tr>'
    +'<th>Khách hàng / D&#7921; án / Section</th>'
    +'<th class="r">T&#7891;n kho</th><th class="r">Mã có hàng</th><th class="r">T&#7893;ng mã</th><th style="width:110px">&#272;&#7897; ph&#7911;</th>'
    +'</tr></thead><tbody>';

  const MP=myProjects(), MC_STOCK=myCustomers();
  MC_STOCK.forEach(cu=>{
    const projs=MP.filter(p=>p.customer===cu);
    let cOn=0,cCodes=0,cTotal=0;
    projs.forEach(p=>{ const s=stockOfProject(p); cOn+=s.on; cCodes+=s.codes; cTotal+=s.total; });
    if(onlyStock && cOn===0) return;
    const cKey='c|'+cu, cOpenNow=stOpen[cKey]===true;
    h+='<tr class="lv1'+(cOpenNow?' open':'')+'" data-k="'+esc(cKey)+'">'
      +'<td><span class="caret">'+(cOpenNow?'&#9662;':'&#9656;')+'</span><b>'+esc(cu)+'</b> <span class="sub">'+projs.length+' d&#7921; án</span></td>'
      +'<td class="r num big'+(cOn>0?' pos':'')+'">'+nfm(cOn)+'</td>'
      +'<td class="r num">'+cCodes+'</td><td class="r num sub">'+cTotal+'</td>'
      +'<td>'+bar(cCodes,cTotal)+'</td></tr>';
    if(!cOpenNow) return;

    projs.forEach(p=>{
      const ps=stockOfProject(p);
      if(onlyStock && ps.on===0) return;
      const pKey='p|'+p.pkey, pOpenNow=stOpen[pKey]===true;
      h+='<tr class="lv2'+(pOpenNow?' open':'')+'" data-k="'+esc(pKey)+'">'
        +'<td><span class="caret">'+(pOpenNow?'&#9662;':'&#9656;')+'</span>'+esc(p.project)+' <span class="sub">'+p.towers+' tháp</span></td>'
        +'<td class="r num'+(ps.on>0?' pos':'')+'">'+nfm(ps.on)+'</td>'
        +'<td class="r num">'+ps.codes+'</td><td class="r num sub">'+ps.total+'</td>'
        +'<td>'+bar(ps.codes,ps.total)+'</td></tr>';
      if(!pOpenNow) return;

      sectionsOf(p).forEach(x=>{
        const ss=stockOfSection(p,x.s);
        if(onlyStock && ss.on===0) return;
        h+='<tr class="lv3"><td><span class="secdot '+secPos(x.s)+'"></span>'
          +'<b class="secn">'+esc(x.s)+'</b> <span class="sub">'+secLabel(x.s)+'</span></td>'
          +'<td class="r num'+(ss.on>0?' pos':'')+'">'+nfm(ss.on)+'</td>'
          +'<td class="r num">'+ss.codes+'</td><td class="r num sub">'+ss.total+'</td>'
          +'<td>'+bar(ss.codes,ss.total)+'</td></tr>';
      });
    });
  });
  h+='</tbody><tfoot><tr><td><b>T&#7892;NG C&#7896;NG</b></td><td class="r num big pos">'+nfm(gTot)+'</td>'
    +'<td class="r num">'+gCodes+'</td><td class="r num sub">'+gItems+'</td><td></td></tr></tfoot></table>';
  view.innerHTML=h;

  view.querySelectorAll('tr[data-k]').forEach(tr=>tr.onclick=()=>{
    const k=tr.dataset.k;
    stOpen[k]=!(stOpen[k]===true);
    render();
  });
  view.querySelectorAll('.stkf').forEach(b=>b.onclick=()=>{
    if(b.dataset.f) stOpen.__filter=(b.dataset.f==='have');
    if(b.dataset.x==='open'){ myCustomers().forEach(cu=>stOpen['c|'+cu]=true); myProjects().forEach(p=>stOpen['p|'+p.pkey]=true); }
    if(b.dataset.x==='close'){ myCustomers().forEach(cu=>stOpen['c|'+cu]=false); myProjects().forEach(p=>stOpen['p|'+p.pkey]=false); }
    render();
  });
}

}

/* ================= ĐỒNG BỘ GOOGLE SHEET (Apps Script) ================= */
let SYNCING=false, lastSync=0, BACKEND_CU=false;
function apiReady(){ return !!(CFG.url && /^https:\/\/script\.google\.com\//.test(CFG.url)); }
// POST không gây preflight (text/plain) — Apps Script đọc e.postData.contents
async function apiPost(payload){
  if(!apiReady()) return null;
  const res=await fetch(CFG.url,{ method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
    body:JSON.stringify(Object.assign({token:CFG.token||'im'},payload)) });
  const txt=await res.text();
  try{ return JSON.parse(txt); }catch(e){ throw new Error('Backend tr&#7843; v&#7873; không ph&#7843;i JSON (ki&#7875;m tra quy&#7873;n truy c&#7853;p "Anyone")'); }
}
// gửi ngầm, không chặn thao tác
function apiFire(payload){ if(!apiReady()) return; apiPost(payload).catch(function(){}); }

// kéo dữ liệu mới từ Sheet về — CHỈ LẤY PHẦN MỚI (đồng bộ tăng dần)
const LS_POS='mc_pro2_syncpos';
let SYNCPOS=(function(){ try{ const v=JSON.parse(localStorage.getItem(LS_POS))||{}; return {req:v.req||0,sheets:v.sheets||{},prj:v.prj||0,want:v.want!==false&&!v.prj} }catch(e){ return {req:0,sheets:{},prj:0,want:true} } })();
function savePos(){ try{ localStorage.setItem(LS_POS,JSON.stringify(SYNCPOS)) }catch(e){} }

async function apiSync(silent){
  if(!apiReady()){ if(!silent) toast('Ch&#432;a c&#7845;u hình &#273;&#7883;a ch&#7881; Apps Script',true); return; }
  if(SYNCING) return;
  SYNCING=true; updateSyncUI('&#8987;');
  try{
    const out=await apiPost({action:'pull', fromReq:SYNCPOS.req, fromSheets:SYNCPOS.sheets,
      fromPrj:SYNCPOS.prj||0, wantProjects:!!SYNCPOS.want});
    if(out && out.ok){
      let nOrd=0, nTx=0, nUp=0;
      // yêu cầu mới
      (out.orders||[]).forEach(function(o){
        const i=ORDERS.findIndex(x=>x.id===o.id);
        if(i<0){ ORDERS.unshift(o); nOrd++; return; }
        // KHÔNG hạ trạng thái: đơn đã cấp phát tại máy thì giữ nguyên,
        // tránh việc duyệt xuất lần hai và trừ tồn gấp đôi.
        const cu=ORDERS[i];
        if(cu.status==='issued' && o.status!=='issued'){
          o.status='issued'; o.issuedTs=cu.issuedTs;
          apiFire({action:'approve', id:cu.id, by:(CFG.orderer||'Kho'), issuedTs:cu.issuedTs}); // gửi lại cho máy chủ
        }
        ORDERS[i]=o;
      });
      // yêu cầu cũ vừa được duyệt
      (out.updated||[]).forEach(function(u){
        const o=ORDERS.find(x=>x.id===u.id);
        if(o && o.status!=='issued'){ o.status='issued'; o.issuedTs=u.issuedTs; nUp++; }
      });
      // giao dịch mới
      (out.tx||[]).forEach(function(t){
        if(!t.uid) return;
        if(!TX.some(x=>x.uid===t.uid)){ TX.push(t); idxAdd(t); nTx++; }
      });
      // DANH MỤC DỰ ÁN: Sheet là chuẩn — thay toàn bộ danh mục tại máy
      let prjChanged=false;
      if(out.projects && Array.isArray(out.projects)){
        SHEETPROJ=out.projects.map(function(p){
          return { pkey:p.pkey, cu:p.cu, pj:p.pj, tw:p.tw, dp:'IM', it:p.it||[] }; });
        saveSheetProj(); SYNCPOS.want=false; prjChanged=true;
      }
      // Nối được backend đời mới -> Google Sheet là nguồn chuẩn, bỏ hẳn dữ liệu mẫu
      // (kể cả khi Sheet chưa có dự án nào, lúc đó app hiện trống và chờ Kho nạp BOM)
      if(typeof out.rowsPrj==='number'){
        if(out.rowsPrj===0 && SHEETPROJ.length){ SHEETPROJ=[]; saveSheetProj(); prjChanged=true; }
      } else if(!BACKEND_CU){
        BACKEND_CU=true;
        toast('Backend &#273;ang dùng b&#7843;n C&#361; &#8212; c&#7853;p nh&#7853;t Code.gs r&#7891;i Deploy "New version"',true);
      }
      if(typeof out.rowsPrj==='number') SYNCPOS.prj=out.rowsPrj;
      if(typeof out.rowsReq==='number') SYNCPOS.req=out.rowsReq;
      if(out.rows) SYNCPOS.sheets=out.rows;   // vị trí đã nhận của từng sheet Nhap_/Xuat_
      savePos();
      ORDERS.sort((a,b)=>b.ts-a.ts);
      saveOrders(); save();
      lastSync=Date.now(); updateSyncUI('&#10004;');
      if(!silent){
        if(BACKEND_CU) toast('&#9888; Backend b&#7843;n C&#360; &#8212; c&#7853;p nh&#7853;t Code.gs r&#7891;i Deploy "New version" &#273;&#7875; các máy dùng chung d&#7919; li&#7879;u',true);
        else toast(nOrd+nTx+nUp
          ? '&#272;ã c&#7853;p nh&#7853;t: '+nOrd+' yêu c&#7847;u m&#7899;i, '+nUp+' &#273;ã duy&#7879;t, '+nTx+' giao d&#7883;ch'
          : '&#272;ã &#273;&#7891;ng b&#7897; &#8212; không có d&#7919; li&#7879;u m&#7899;i', false, true);
      }
      if(prjChanged){
        // danh mục đổi -> dựng lại toàn bộ để mọi màn hình khớp với Sheet
        toast('&#272;ã c&#7853;p nh&#7853;t danh m&#7909;c d&#7921; án t&#7915; Google Sheet',false,true);
        setTimeout(function(){ location.reload(); },600);
        SYNCING=false; return;
      }
      if(nOrd||nTx||nUp) render();
    } else if(out && out.error){ updateSyncUI('&#9888;'); if(!silent) toast('L&#7895;i: '+out.error,true); }
  }catch(e){ updateSyncUI('&#9888;'); if(!silent) toast('Không k&#7871;t n&#7889;i &#273;&#432;&#7907;c: '+(e.message||e),true); }
  SYNCING=false;
}
// NẠP LẠI TOÀN BỘ TỪ GOOGLE SHEET — xoá sạch dữ liệu tại máy rồi tải lại từ đầu.
// Dùng khi muốn máy này khớp tuyệt đối với Sheet (Sheet là nguồn chuẩn).
async function apiResync(){
  if(!apiReady()){ toast('Ch&#432;a c&#7845;u hình &#273;&#7883;a ch&#7881; Apps Script',true); return; }
  const chuaGui=TX.filter(t=>!t.uid).length;
  const canh='N&#7840;P L&#7840;I TOÀN B&#7896; T&#7914; GOOGLE SHEET\n\n'
    +'&#8226; Xoá s&#7841;ch danh m&#7909;c d&#7921; án, giao d&#7883;ch và yêu c&#7847;u &#273;ang l&#432;u t&#7841;i máy này\n'
    +'&#8226; T&#7843;i l&#7841;i toàn b&#7897; theo &#273;úng d&#7919; li&#7879;u trên Google Sheet\n'
    +(chuaGui?'\n&#9888; CÓ '+chuaGui+' giao d&#7883;ch ch&#432;a g&#7917;i lên Sheet &#8212; s&#7869; M&#7844;T.\n':'')
    +'\nTi&#7871;p t&#7909;c?';
  if(!confirm(decodeEnt(canh))) return;
  TX=[]; ORDERS=[]; CART=[]; SHEETPROJ=[]; DELETED=[];
  SYNCPOS={req:0,sheets:{},prj:0,want:true};
  idxBuild(); save(); saveOrders(); saveCart(); saveSheetProj(); saveDeleted(); savePos();
  toast('&#272;ang n&#7841;p l&#7841;i t&#7915; Google Sheet&#8230;');
  await apiSync(false);
  setTimeout(function(){ location.reload(); },800);
}

  b.innerHTML=icon+' <span class="sl">&#272;&#7891;ng b&#7897;</span>';

}

function approveIssue(oid){
  const o=ORDERS.find(x=>x.id===oid); if(!o||o.status!=='pending') return;
  // chống trừ tồn hai lần: nếu đã có giao dịch xuất mang mã yêu cầu này thì thôi
  if(TX.some(t=>t.ord===oid)){
    o.status='issued'; o.issuedTs=o.issuedTs||Date.now(); saveOrders();
    toast('Yêu c&#7847;u này &#273;ã &#273;&#432;&#7907;c c&#7845;p phát tr&#432;&#7899;c &#273;ó &#8212; không tr&#7915; t&#7891;n l&#7841;i',true);
    render(); return;
  }
  const p=PROJECTS.find(x=>x.pkey===o.pkey)||PROJECTS[o.pid];
  // KIỂM TRA TỒN KHO — không cho xuất vượt quá số lượng đang có
  const lack=[];
  o.lines.forEach(l=>{ const it=p&&p.items.find(i=>i.code===l.code);
    const on=it?stockOf(it):0;
    if(on<l.qty) lack.push({code:l.code,need:l.qty,on}); });
  if(lack.length){
    const NL=String.fromCharCode(10);
    const txt='KHÔNG ĐỦ TỒN KHO — không thể duyệt xuất:'+NL+NL
      + lack.map(x=>'• '+x.code+' : yêu cầu '+x.need+', tồn '+x.on+' (thiếu '+(x.need-x.on)+')').join(NL)
      + NL+NL+'Hãy nhập kho bổ sung, hoặc yêu cầu bộ phận giảm số lượng.';
    alert(txt);
    toast('Không &#273;&#7911; t&#7891;n &#8212; '+lack.length+' mã thi&#7871;u',true);
    return;
  }
  if(!confirm(decodeEnt('Duy&#7879;t xu&#7845;t '+o.lines.length+' mã cho '+o.dept+' &#183; '+o.project+'?\\nS&#7889; l&#432;&#7907;ng s&#7869; b&#7883; tr&#7915; kh&#7887;i t&#7891;n kho.'))) return;
  let done=0;
  o.lines.forEach(l=>{ const it=p&&p.items.find(i=>i.code===l.code);
    if(it){ const rec={k:itemKey(it),pk:it.pkey,code:it.code,pid:it.pid,type:'out',qty:l.qty,ts:Date.now(),ord:oid,
      uid:'t'+Date.now().toString(36)+Math.random().toString(36).slice(2,6), by:(CFG.orderer||'Kho')};
      TX.push(rec); idxAdd(rec); apiFire({action:'tx', tx:rec, customer:it.customer, project:it.project, section:it.section, desc:it.desc, unit:it.unit}); done++; } });
  save();
  o.status='issued'; o.issuedTs=Date.now(); saveOrders();
  apiFire({action:'approve', id:o.id, by:(CFG.orderer||'Kho'), issuedTs:o.issuedTs});
  toast('&#10004; &#272;ã duy&#7879;t xu&#7845;t '+done+' mã',false,true);
  render();
}

// Logic tạo báo cáo Excel — dùng chung với app (kiểm chứng bằng exceljs thật)
const NAVY='FF0067AC', SKY='FF00A1E4', LIGHT='FFE4F1FA', ZEBRA='FFF5FAFD',
  LINE='FFBFD6E8', TEAL='FF0E8F78', ORANGE='FFE87722', DARK='FF12293C';

const thin={style:'thin',color:{argb:LINE}};
const BORDER={top:thin,left:thin,bottom:thin,right:thin};

function buildReport(ExcelJS, p, TX, ORDERS, stats, logoB64){
  const wb=new ExcelJS.Workbook();
  wb.creator='CS Wind Vietnam - Internal Warehouse';
  wb.created=new Date();
  const logoId = logoB64 ? wb.addImage({base64:logoB64, extension:'png'}) : null;

  const tx=TX.filter(t=>t.pk===p.pkey);
  const dt=ts=>{const d=new Date(ts),z=n=>String(n).padStart(2,'0');
    return z(d.getDate())+'/'+z(d.getMonth()+1)+'/'+d.getFullYear()+' '+z(d.getHours())+':'+z(d.getMinutes());};
  const dOnly=ts=>{const d=new Date(ts),z=n=>String(n).padStart(2,'0');
    return z(d.getDate())+'/'+z(d.getMonth()+1)+'/'+d.getFullYear();};
  const hOnly=ts=>{const d=new Date(ts),z=n=>String(n).padStart(2,'0');
    return z(d.getHours())+':'+z(d.getMinutes());};
  // gộp giao dịch theo từng ngày (đã sắp xếp tăng dần)
  function groupByDay(list){
    const m=new Map();
    list.forEach(t=>{ const k=dOnly(t.ts); if(!m.has(k))m.set(k,[]); m.get(k).push(t); });
    return [...m.entries()].map(([day,items])=>({day,items}));
  }
  const findIt=code=>p.items.find(i=>i.code===code)||{};

  // ---- khối tiêu đề chung cho mọi sheet ----
  function header(ws, title, ncol){
    ws.mergeCells(1,1,4,2);                       // ô đặt logo
    if(logoId!=null) ws.addImage(logoId,{tl:{col:0.15,row:0.35},ext:{width:140,height:45}});
    ws.mergeCells(1,3,1,ncol);
    const c1=ws.getCell(1,3); c1.value='CS WIND VIETNAM';
    c1.font={name:'Arial',size:14,bold:true,color:{argb:NAVY}};
    c1.alignment={vertical:'middle',horizontal:'left'};
    ws.mergeCells(2,3,2,ncol);
    const c2=ws.getCell(2,3); c2.value='INTERNAL WAREHOUSE - MATERIAL CONTROL';
    c2.font={name:'Arial',size:9,bold:true,color:{argb:SKY}};
    ws.mergeCells(3,3,4,ncol);
    const c3=ws.getCell(3,3); c3.value=title;
    c3.font={name:'Arial',size:16,bold:true,color:{argb:DARK}};
    c3.alignment={vertical:'middle',horizontal:'left'};
    ws.getRow(1).height=18; ws.getRow(2).height=13; ws.getRow(3).height=15; ws.getRow(4).height=15;
    // vạch cam ngăn cách
    ws.mergeCells(5,1,5,ncol);
    const bar=ws.getCell(5,1); bar.fill={type:'pattern',pattern:'solid',fgColor:{argb:ORANGE}};
    ws.getRow(5).height=3;
    // dòng thông tin dự án
    ws.mergeCells(6,1,6,ncol);
    const info=ws.getCell(6,1);
    info.value='Khách hàng: '+p.customer+'     |     Dự án: '+p.project+'     |     Số tháp: '+p.towers+'     |     Ngày xuất: '+dt(Date.now());
    info.font={name:'Arial',size:9,italic:true,color:{argb:'FF54718A'}};
    ws.getRow(6).height=16;
    ws.getRow(7).height=6;
    return 8;   // dòng bắt đầu bảng
  }

  function tableHead(ws,row,cols){
    const r=ws.getRow(row);
    cols.forEach((c,i)=>{ const cell=r.getCell(i+1);
      cell.value=c.t;
      cell.fill={type:'pattern',pattern:'solid',fgColor:{argb:NAVY}};
      cell.font={name:'Arial',size:10,bold:true,color:{argb:'FFFFFFFF'}};
      cell.alignment={vertical:'middle',horizontal:'center',wrapText:true};
      cell.border=BORDER;
    });
    r.height=30;
    ws.columns=cols.map(c=>({width:c.w}));
    ws.views=[{state:'frozen',ySplit:row}];
  }
  function bodyRow(ws,row,vals,cols,idx){
    const r=ws.getRow(row);
    vals.forEach((v,i)=>{ const cell=r.getCell(i+1);
      cell.value=v;
      cell.font={name:'Arial',size:10,color:{argb:DARK}};
      cell.alignment={vertical:'middle',horizontal:cols[i].a||'left',wrapText:false};
      cell.border=BORDER;
      if(idx%2===1) cell.fill={type:'pattern',pattern:'solid',fgColor:{argb:ZEBRA}};
      if(cols[i].fmt) cell.numFmt=cols[i].fmt;
    });
    r.height=18;
  }
  function dayRow(ws,row,vals,cols){
    const r=ws.getRow(row);
    vals.forEach((v,i)=>{ const cell=r.getCell(i+1);
      cell.value=v;
      cell.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FFEFF7FC'}};
      cell.font={name:'Arial',size:10,bold:true,italic:true,color:{argb:SKY}};
      cell.alignment={vertical:'middle',horizontal:cols[i].a||'left'};
      cell.border=BORDER;
      if(cols[i].fmt) cell.numFmt=cols[i].fmt;
    });
    r.height=18;
  }
  function totalRow(ws,row,vals,cols){
    const r=ws.getRow(row);
    vals.forEach((v,i)=>{ const cell=r.getCell(i+1);
      cell.value=v;
      cell.fill={type:'pattern',pattern:'solid',fgColor:{argb:LIGHT}};
      cell.font={name:'Arial',size:10,bold:true,color:{argb:NAVY}};
      cell.alignment={vertical:'middle',horizontal:cols[i].a||'left'};
      cell.border={...BORDER,top:{style:'medium',color:{argb:NAVY}}};
      if(cols[i].fmt) cell.numFmt=cols[i].fmt;
    });
    r.height=20;
  }
  function signature(ws,row,ncol){
    // chia đều 3 khối ký trên toàn bề rộng bảng
    const n=Math.max(3,ncol);
    const b1=1, b2=Math.max(2,Math.round(n/3)+1), b3=Math.max(b2+1,Math.round(2*n/3)+1);
    const spans=[[b1,b2-1],[b2,b3-1],[b3,n]];
    const titles=['NGƯỜI LẬP BIỂU','TRƯỞNG BỘ PHẬN','GIÁM ĐỐC'];
    spans.forEach((sp,i)=>{
      if(sp[0]>sp[1]) return;
      ws.mergeCells(row,sp[0],row,sp[1]);
      const c=ws.getCell(row,sp[0]);
      c.value=titles[i];
      c.font={name:'Arial',size:10,bold:true,color:{argb:NAVY}};
      c.alignment={horizontal:'center',vertical:'middle'};
      ws.mergeCells(row+1,sp[0],row+1,sp[1]);
      const c2=ws.getCell(row+1,sp[0]);
      c2.value='(Ký, ghi rõ họ tên)';
      c2.font={name:'Arial',size:9,italic:true,color:{argb:'FF54718A'}};
      c2.alignment={horizontal:'center',vertical:'middle'};
    });
    ws.getRow(row).height=20;
    ws.getRow(row+1).height=15;
    ws.getRow(row+2).height=52;   // chỗ trống để ký
  }

  /* ============ SHEET 1: TỔNG HỢP NHẬP - XUẤT - TỒN ============ */
  {
    const cols=[
      {t:'STT',w:6,a:'center'},{t:'Mã vật tư',w:22},{t:'Mô tả',w:40},{t:'Section',w:11,a:'center'},
      {t:'ĐVT',w:8,a:'center'},{t:'Định mức /tháp',w:11,a:'center'},{t:'Nhu cầu ('+p.towers+' tháp)',w:13,a:'center'},
      {t:'Đã nhập',w:11,a:'center'},{t:'Đã xuất',w:11,a:'center'},{t:'Tồn kho',w:11,a:'center'},{t:'% đạt',w:9,a:'center',fmt:'0%'}];
    const ws=wb.addWorksheet('Tong hop N-X-T',{pageSetup:{orientation:'landscape',fitToPage:true,fitToWidth:1,fitToHeight:0}});
    const start=header(ws,'BÁO CÁO NHẬP - XUẤT - TỒN VẬT TƯ',cols.length);
    tableHead(ws,start,cols);
    let row=start+1, tIn=0,tOut=0,tOn=0;
    p.items.forEach((it,i)=>{
      const rec=stats.recv(it), out=tx.filter(t=>t.code===it.code&&t.type==='out').reduce((n,t)=>n+t.qty,0), on=stats.stock(it);
      tIn+=rec; tOut+=out; tOn+=on;
      bodyRow(ws,row,[i+1,it.code,it.desc||'',it.section||'',it.unit||'',1,p.towers,rec,out,on, p.towers?rec/p.towers:0],cols,i);
      row++;
    });
    totalRow(ws,row,['','TỔNG CỘNG','','','','','',tIn,tOut,tOn,''],cols);
    ws.autoFilter={from:{row:start,column:1},to:{row:row-1,column:cols.length}};
    signature(ws,row+2,cols.length);
  }

  /* ====== SHEET 2 & 3: CHI TIẾT NHẬP / XUẤT THEO NGÀY (ngày = cột) ====== */
  function matrixSheet(kind){
    const isIn = kind==='in';
    const list = tx.filter(t=>t.type===kind).sort((a,b)=>a.ts-b.ts);
    const days = [...new Set(list.map(t=>dOnly(t.ts)))];          // các ngày có phát sinh
    const title = isIn ? 'BẢNG THEO DÕI NHẬP KHO THEO NGÀY' : 'BẢNG THEO DÕI XUẤT KHO THEO NGÀY';
    const name  = isIn ? 'Chi tiet nhap kho' : 'Chi tiet xuat kho';
    const qtyTitle = isIn ? 'TỔNG NHẬP' : 'TỔNG XUẤT';

    // cột cố định + mỗi ngày một cột + cột tổng
    const fixed=[{t:'STT',w:6,a:'center'},{t:'Mã vật tư',w:22},{t:'Mô tả',w:36},
      {t:'Section',w:10,a:'center'},{t:'ĐVT',w:7,a:'center'}];
    const cols=fixed.concat(days.map(d=>({t:d,w:11,a:'center'})),[{t:qtyTitle,w:12,a:'center'}]);
    const ws=wb.addWorksheet(name,{pageSetup:{orientation:'landscape',fitToPage:true,fitToWidth:1,fitToHeight:0}});
    const start=header(ws,title,cols.length);
    tableHead(ws,start,cols);

    // gom số lượng theo (mã, ngày)
    const map=new Map();                       // code -> {day: qty}
    list.forEach(t=>{ if(!map.has(t.code))map.set(t.code,{});
      const m=map.get(t.code); m[dOnly(t.ts)]=(m[dOnly(t.ts)]||0)+t.qty; });

    let row=start+1, stt=0, zi=0;
    const dayTot={};
    const order=p.items.filter(it=>map.has(it.code));
    map.forEach((_,code)=>{ if(!order.some(o=>o.code===code)) order.push({code,desc:'',section:'',unit:''}); });

    order.forEach(it=>{
      const m=map.get(it.code)||{}; let rowTot=0;
      const vals=[++stt,it.code,it.desc||'',it.section||'',it.unit||''];
      days.forEach(d=>{ const q=m[d]||0; rowTot+=q; dayTot[d]=(dayTot[d]||0)+q; vals.push(q||''); });
      vals.push(rowTot);
      bodyRow(ws,row,vals,cols,zi++);
      // tô đậm cột tổng của dòng
      ws.getRow(row).getCell(cols.length).font={name:'Arial',size:10,bold:true,color:{argb:NAVY}};
      row++;
    });

    // dòng cộng theo từng ngày
    const totals=['','TỔNG CỘNG THEO NGÀY','','',''];
    let grand=0;
    days.forEach(d=>{ totals.push(dayTot[d]||0); grand+=dayTot[d]||0; });
    totals.push(grand);
    totalRow(ws,row,totals,cols);
    if(order.length) ws.autoFilter={from:{row:start,column:1},to:{row:row-1,column:5}};
    signature(ws,row+2,cols.length);
  }
  matrixSheet('in');
  matrixSheet('out');

  /* ============ SHEET 4: THÔNG TIN & TỔNG KẾT ============ */
  {
    // dùng 6 cột để tiêu đề và khối ký trải đều, bảng gộp ô cho cân đối
    const NC=6, W=[24,16,16,16,16,16];
    const ws=wb.addWorksheet('Thong tin du an',{pageSetup:{orientation:'portrait',fitToPage:true,fitToWidth:1,fitToHeight:0}});
    const start=header(ws,'HỒ SƠ LƯU TRỮ DỰ ÁN',NC);
    ws.columns=W.map(w=>({width:w}));
    // tiêu đề bảng
    ws.mergeCells(start,1,start,2); ws.mergeCells(start,3,start,NC);
    [[1,'CHỈ TIÊU'],[3,'GIÁ TRỊ']].forEach(([c,t])=>{ const cell=ws.getCell(start,c);
      cell.value=t; cell.fill={type:'pattern',pattern:'solid',fgColor:{argb:NAVY}};
      cell.font={name:'Arial',size:10,bold:true,color:{argb:'FFFFFFFF'}};
      cell.alignment={vertical:'middle',horizontal:'center'};
    });
    for(let c=1;c<=NC;c++) ws.getCell(start,c).border=BORDER;
    ws.getRow(start).height=24;
    ws.views=[{state:'frozen',ySplit:start}];

    const totIn=tx.filter(t=>t.type==='in').reduce((n,t)=>n+t.qty,0);
    const totOut=tx.filter(t=>t.type==='out').reduce((n,t)=>n+t.qty,0);
    const nIn=tx.filter(t=>t.type==='in').length, nOut=tx.filter(t=>t.type==='out').length;
    const dayIn=groupByDay(tx.filter(t=>t.type==='in')).length, dayOut=groupByDay(tx.filter(t=>t.type==='out')).length;
    const blocks=[
      ['THÔNG TIN DỰ ÁN',[['Khách hàng',p.customer],['Tên dự án',p.project],['Số tháp',p.towers],
        ['Số mã vật tư',p.items.length],['Số section',stats.nsec]]],
      ['TỔNG KẾT NHẬP - XUẤT - TỒN',[['Tổng số lượng đã nhập',totIn],['Tổng số lượng đã xuất',totOut],
        ['Tồn kho còn lại',totIn-totOut],['Tỷ lệ đạt so với BOM',Math.round(stats.pct)+'%']]],
      ['GIAO DỊCH',[['Số lượt nhập kho',nIn+' lượt / '+dayIn+' ngày'],['Số lượt xuất kho',nOut+' lượt / '+dayOut+' ngày'],
        ['Tổng số lượt giao dịch',tx.length]]],
      ['HỒ SƠ',[['Ngày xuất báo cáo',dt(Date.now())],['Đơn vị lập','Internal Warehouse - Material Control']]],
    ];
    let row=start+1, zi=0;
    blocks.forEach(([title,rows])=>{
      // dòng tiêu đề nhóm
      ws.mergeCells(row,1,row,NC);
      const g=ws.getCell(row,1); g.value=title;
      g.fill={type:'pattern',pattern:'solid',fgColor:{argb:LIGHT}};
      g.font={name:'Arial',size:10,bold:true,color:{argb:NAVY}};
      g.alignment={vertical:'middle',horizontal:'left',indent:1};
      for(let c=1;c<=NC;c++) ws.getCell(row,c).border=BORDER;
      ws.getRow(row).height=20; row++;
      rows.forEach(([k,v])=>{
        ws.mergeCells(row,1,row,2); ws.mergeCells(row,3,row,NC);
        const a=ws.getCell(row,1), b=ws.getCell(row,3);
        a.value=k; b.value=v;
        a.font={name:'Arial',size:10,bold:true,color:{argb:DARK}};
        b.font={name:'Arial',size:10,color:{argb:DARK}};
        a.alignment={vertical:'middle',horizontal:'left',indent:1};
        b.alignment={vertical:'middle',horizontal:'left',indent:1};
        if(zi%2===1){ const f={type:'pattern',pattern:'solid',fgColor:{argb:ZEBRA}};
          for(let c=1;c<=NC;c++) ws.getCell(row,c).fill=f; }
        for(let c=1;c<=NC;c++) ws.getCell(row,c).border=BORDER;
        ws.getRow(row).height=18; row++; zi++;
      });
    });
    signature(ws,row+2,NC);
  }
  return wb;
}

// ===== XUẤT EXCEL LƯU TRỮ DỰ ÁN (báo cáo công ty) =====
async function exportProjectExcel(p){
  if(typeof ExcelJS==='undefined'){ toast('Chưa tải được thư viện Excel (cần mạng lần đầu)',true); return; }
  try{
    const stats={ stock:stockOf, recv:recvOf, nsec:sectionsOf(p).length, pct:projStat(p).pct };
    const wb=buildReport(ExcelJS,p,TX,ORDERS,stats,CSWIND_LOGO);
    const buf=await wb.xlsx.writeBuffer();
    const blob=new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
    const safe=(p.customer+'_'+p.project).replace(/[^\w\-]+/g,'_').slice(0,60);
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
    a.download='BaoCao_LuuTru_'+safe+'.xlsx'; document.body.appendChild(a); a.click();
    setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },1000);
    toast('&#10004; Đã xuất báo cáo Excel',false,true);
  }catch(e){ toast('Lỗi xuất Excel: '+(e.message||e),true); }
}

// đổi HTML entity sang ký tự thật cho Excel
function decodeEnt(s){ const t=document.createElement('textarea'); t.innerHTML=s; return t.value; }

// ===== XOÁ DỰ ÁN ĐÃ KẾT THÚC =====
async function deleteProject(p){
  const tx=TX.filter(t=>t.pk===p.pkey);
  const msg='Xoá d&#7921; án "'+p.project+'" ('+p.customer+')?\n\n'
    +'&#8226; '+p.items.length+' mã v&#7853;t t&#432;\n&#8226; '+tx.length+' l&#432;&#7907;t nh&#7853;p/xu&#7845;t\n\n'
    +'Hãy XU&#7844;T EXCEL L&#431;U TR&#7918; tr&#432;&#7899;c khi xoá. Thao tác này KHÔNG th&#7875; hoàn tác.';
  if(!confirm(decodeEnt(msg))) return;
  // Mật khẩu xoá: ưu tiên kiểm tra trên máy chủ (mỗi người một mật khẩu riêng),
  // không có mạng thì dùng mật khẩu dự phòng lưu tại máy.
  const pw=prompt(decodeEnt('Nh&#7853;p M&#7852;T KH&#7848;U cá nhân &#273;&#7875; xoá d&#7921; án:'));
  if(pw===null) return;
  let nguoiXoa='';
  if(apiReady()){
    toast('&#272;ang ki&#7875;m tra quy&#7873;n xoá&#8230;');
    try{
      const out=await apiPost({action:'checkpass', pass:String(pw)});
      if(!out||!out.ok){ toast('Sai m&#7853;t kh&#7849;u ho&#7863;c không có quy&#7873;n xoá',true); return; }
      nguoiXoa=out.by||'';
    }catch(e){
      // mất mạng: cho phép dùng mật khẩu dự phòng tại máy
      if(String(pw)!==String(CFG.pass||DEFAULT_PASS)){ toast('Không k&#7871;t n&#7889;i &#273;&#432;&#7907;c và m&#7853;t kh&#7849;u d&#7921; phòng sai',true); return; }
      nguoiXoa=(CFG.orderer||ROLE)+' (ngo&#7841;i tuy&#7871;n)';
    }
  } else {
    if(String(pw)!==String(CFG.pass||DEFAULT_PASS)){ toast('Sai m&#7853;t kh&#7849;u &#8212; không xoá',true); return; }
    nguoiXoa=(CFG.orderer||ROLE);
  }
  if(!confirm(decodeEnt('Xác nh&#7853;n l&#7847;n cu&#7889;i: '+nguoiXoa+' xoá v&#297;nh vi&#7877;n d&#7921; án và toàn b&#7897; l&#7883;ch s&#7917; nh&#7853;p/xu&#7845;t c&#7911;a nó?'))) return;
  apiFire({action:'logdelete', by:nguoiXoa, customer:p.customer, project:p.project,
           dept:p.dept, items:p.items.length, tx:tx.length, pkey:p.pkey, role:ROLE});
  // xoá giao dịch + order + giỏ hàng của dự án
  TX=TX.filter(t=>t.pk!==p.pkey); idxBuild(); save();
  ORDERS=ORDERS.filter(o=>o.pkey!==p.pkey); saveOrders();
  CART=CART.filter(c=>pkeyOf(c.customer,c.project,c.dept||p.dept)!==p.pkey); saveCart();
  // nếu là dự án tự tạo thì xoá hẳn, còn dự án có sẵn thì đánh dấu ẩn
  const si=SHEETPROJ.findIndex(x=>(x.pkey||pkeyOf(x.cu,x.pj,x.dp))===p.pkey);
  if(si>=0){ SHEETPROJ.splice(si,1); saveSheetProj(); }
  const ui=USERPROJ.findIndex(x=>pkeyOf(x.cu,x.pj,x.dp)===p.pkey);
  if(ui>=0){ USERPROJ.splice(ui,1); saveUserProj(); }
  if(si<0&&ui<0){ DELETED.push(p.pkey); saveDeleted(); }
  apiFire({action:'delproject', pkey:p.pkey});
  toast('&#272;ã xoá d&#7921; án '+p.project+' &#183; b&#7903;i '+nguoiXoa,false,true);
  setTimeout(()=>location.reload(),700);
}

// đọc BOM từ file Excel/CSV bằng SheetJS
function importBomExcel(e){
  const f=e.target.files&&e.target.files[0]; e.target.value='';
  if(!f) return;
  if(typeof XLSX==='undefined'){ toast('Ch&#432;a t&#7843;i &#273;&#432;&#7907;c thư vi&#7879;n &#273;&#7885;c Excel (c&#7847;n m&#7841;ng l&#7847;n &#273;&#7847;u)',true); return; }
  $('#bXlsxMsg').textContent='&#272;ang &#273;&#7885;c '+f.name+'&#8230;';
  const rd=new FileReader();
  rd.onload=ev=>{
    try{
      const wb=XLSX.read(new Uint8Array(ev.target.result),{type:'array'});
      // chọn sheet nhiều dữ liệu nhất
      let best=wb.SheetNames[0], bestN=-1;
      wb.SheetNames.forEach(nm=>{ const rows=XLSX.utils.sheet_to_json(wb.Sheets[nm],{header:1,blankrows:false}); if(rows.length>bestN){bestN=rows.length;best=nm;} });
      const rows=XLSX.utils.sheet_to_json(wb.Sheets[best],{header:1,blankrows:false,defval:''});
      const parsed=parseBomSheet(rows);
      if(!parsed.length){ $('#bXlsxMsg').innerHTML='<span style="color:var(--rust)">Không nh&#7853;n ra c&#7897;t mã trong file. C&#7847;n c&#7897;t có tiêu &#273;&#7873; ki&#7875;u "Material code / Mã code".</span>'; return; }
      BOMROWS=parsed; drawBomRows();
      // gợi ý tên dự án/khách hàng từ tên file nếu trống
      if(!$('#bProj').value){ $('#bProj').value=f.name.replace(/\.(xlsx|xls|csv)$/i,''); }
      $('#bXlsxMsg').innerHTML='<span style="color:var(--teal)">&#10004; &#272;ã n&#7841;p '+parsed.length+' mã t&#7915; sheet "'+esc(best)+'". Ki&#7875;m tra r&#7891;i L&#432;u.</span>';
    }catch(err){ $('#bXlsxMsg').innerHTML='<span style="color:var(--rust)">L&#7895;i &#273;&#7885;c file: '+esc(String(err.message||err))+'</span>'; }
  };
  rd.readAsArrayBuffer(f);
}
// dò cột code/desc/unit/section trong mảng dòng
function parseBomSheet(rows){
  const norm=s=>String(s==null?'':s).replace(/\s+/g,' ').trim().toLowerCase();
  let hidx=-1;
  for(let i=0;i<Math.min(8,rows.length);i++){ if(rows[i].some(c=>/material code|mã code|object id|^code$|mã v&#7853;t t&#432;|mã hàng/.test(norm(c)))) hidx=i; }
  let codeC=-1,descC=-1,unitC=-1,secC=-1;
  const ncol=Math.max(...rows.slice(0,Math.max(1,hidx+1)).map(r=>r.length), ...rows.slice(hidx+1,hidx+30).map(r=>r.length),0);
  if(hidx>=0){
    const head=rows.slice(Math.max(0,hidx-1),hidx+1);
    const find=keys=>{ for(let ci=0;ci<ncol;ci++)for(const r of head){ const v=norm(r[ci]); if(keys.some(k=>v.includes(k)))return ci; } return -1; };
    codeC=find(['material code','mã code','object id','mã v&#7853;t t&#432;','mã hàng','code']);
    descC=find(['description','diễn gi&#7843;i','mô t&#7843;','tên v&#7853;t t&#432;','tên hàng','item name']);
    unitC=find(['unit','&#273;vt','&#273;&#417;n v&#7883;','uom']);
    secC=find(['section','sec id','sec','&#273;o&#7841;n']);
  }
  const data=rows.slice(hidx+1);
  // nếu không có tiêu đề: đoán theo thứ tự cột 0..3
  if(codeC<0){ codeC=0; descC=1; unitC=2; secC=3; }
  const out=[];
  data.forEach(r=>{
    const code=String(r[codeC]==null?'':r[codeC]).trim();
    if(!code||/material code|mã code/i.test(code)) return;
    out.push({
      code,
      desc:descC>=0?String(r[descC]==null?'':r[descC]).trim():'',
      unit:unitC>=0&&r[unitC]?String(r[unitC]).trim():'Set',
      section:(secC>=0&&r[secC]?String(r[secC]):'').trim().toUpperCase()||'TOP'
    });
  });
  return out;
}
function drawBomRows(){
  const tb=$('#bomTb'); if(!tb)return; tb.innerHTML='';
  BOMROWS.forEach((r,i)=>{
    const tr=document.createElement('tr');
    tr.innerHTML='<td><input class="bcode" value="'+esc(r.code)+'" placeholder="mã"></td>'
      +'<td><input class="bdesc" value="'+esc(r.desc)+'" placeholder="mô t&#7843;"></td>'
      +'<td><select class="bunit"><option>Set</option><option>PC</option><option>EA</option><option>M</option></select></td>'
      +'<td><input class="bsec" value="'+esc(r.section)+'" placeholder="TOP" style="text-transform:uppercase"></td>'
      +'<td><button class="drow" data-i="'+i+'">&#215;</button></td>';
    tb.appendChild(tr);
    tr.querySelector('.bunit').value=r.unit||'Set';
    tr.querySelector('.bcode').oninput=e=>BOMROWS[i].code=e.target.value;
    tr.querySelector('.bdesc').oninput=e=>BOMROWS[i].desc=e.target.value;
    tr.querySelector('.bunit').onchange=e=>BOMROWS[i].unit=e.target.value;
    tr.querySelector('.bsec').oninput=e=>BOMROWS[i].section=e.target.value.toUpperCase();
    tr.querySelector('.drow').onclick=()=>{ BOMROWS.splice(i,1); if(!BOMROWS.length)BOMROWS.push({code:'',desc:'',unit:'Set',section:'TOP'}); drawBomRows(); };
  });
}
function pasteBom(){
  const raw=prompt('Dán các dòng (m&#7895;i dòng 1 mã), phân cách b&#7857;ng TAB ho&#7863;c d&#7845;u ; theo th&#7913; t&#7921;: Mã | Mô t&#7843; | &#272;VT | Section');
  if(!raw)return;
  const rows=raw.split(/\r?\n/).map(l=>l.trim()).filter(Boolean).map(l=>{
    const c=l.split(/\t|;|\|/).map(x=>x.trim());
    return {code:c[0]||'',desc:c[1]||'',unit:c[2]||'Set',section:(c[3]||'TOP').toUpperCase()};
  }).filter(r=>r.code);
  if(rows.length){ if(BOMROWS.length===1&&!BOMROWS[0].code)BOMROWS=rows; else BOMROWS=BOMROWS.concat(rows); drawBomRows(); toast('&#272;ã thêm '+rows.length+' dòng',false,true); }
}

  const items=rows.map(r=>({c:r.code.trim(),d:r.desc.trim(),u:r.unit,s:(r.section||'').toUpperCase(),q:1}));
  const pkey=pkeyOf(cu,pj,'IM');

  apiFire({action:'bom', by:(CFG.orderer||ROLE), project:{
    pkey, customer:cu, project:pj, towers:tw,
    items: items.map(i=>({code:i.c,desc:i.d,unit:i.u,section:i.s,qty:i.q})) }});
  closeSheet();
  toast(dauTien
    ? '&#10004; &#272;ã t&#7841;o d&#7921; án '+pj+' &#8212; &#273;ã g&#7905; b&#7887; d&#7919; li&#7879;u m&#7851;u'
    : '&#10004; &#272;ã t&#7841;o d&#7921; án '+pj+' ('+rows.length+' mã)', false, true);
  setTimeout(()=>location.reload(),700); // nạp lại để dựng PROJECTS gồm dự án mới
}

    +'<div class="field"><label>M&#7853;t kh&#7849;u xoá d&#7921; án (d&#7921; phòng khi m&#7845;t m&#7841;ng)</label><input id="cfgPass" type="text" placeholder="M&#7853;t kh&#7849;u d&#7921; phòng" value="'+esc(CFG.pass||DEFAULT_PASS)+'"><div class="hint" style="font-size:11.5px;color:var(--muted);margin-top:4px">Khi có m&#7841;ng, app dùng <b>m&#7853;t kh&#7849;u cá nhân</b> khai báo trong Apps Script (m&#7895;i ng&#432;&#7901;i m&#7897;t mã, có ghi nh&#7853;t ký ai xoá). Ô này ch&#7881; dùng khi m&#7845;t m&#7841;ng. M&#7863;c &#273;&#7883;nh: <b>'+DEFAULT_PASS+'</b> &#8212; nên &#273;&#7893;i.</div></div>'
    +'<button class="sendbtn" id="cfgSave" style="background:linear-gradient(135deg,#12a88d,#0e8f78)">L&#432;u c&#7845;u hình</button>'
    +'<div style="display:flex;gap:8px;margin-top:10px">'
      +'<button class="seeall" id="cfgTest" style="margin:0;flex:1">&#128268; Ki&#7875;m tra k&#7871;t n&#7889;i</button>'
      +'<button class="seeall" id="cfgMail" style="margin:0;flex:1">&#128231; G&#7917;i báo cáo email</button>'
    +'</div>'
    +'<button class="seeall" id="cfgResync" style="margin-top:8px;width:100%;border-color:var(--safety);color:var(--safety-d);background:#fff8f2">&#8635; N&#7841;p l&#7841;i toàn b&#7897; t&#7915; Google Sheet</button>'

    +'<div class="hint" style="font-size:11.5px;color:var(--muted);margin-top:5px;text-align:center">Xoá d&#7919; li&#7879;u t&#7841;i máy và t&#7843;i l&#7841;i &#273;úng theo Sheet. Dùng khi máy b&#7883; l&#7879;ch d&#7919; li&#7879;u.</div>'
    +'<div class="hint" id="cfgMsg" style="font-size:12px;color:var(--muted);margin-top:8px;text-align:center"></div>';
  $('#cfgTest').onclick=async()=>{
    const m=$('#cfgMsg'); m.innerHTML='&#8987; &#272;ang ki&#7875;m tra&#8230;';
    CFG.url=$('#cfgUrl').value.trim(); CFG.token=($('#cfgToken').value||'im').trim(); saveCfg();
    try{ const out=await apiPost({action:'ping'});
      if(!out||!out.ok){ m.innerHTML='<b style="color:var(--rust)">&#10007; '+esc((out&&out.error)||'không ph&#7843;n h&#7891;i')+'</b>'; return; }
      const cu = !out.version;
      m.innerHTML='<b style="color:var(--teal)">&#10004; K&#7871;t n&#7889;i t&#7889;t</b> &#183; Sheet: '+esc(out.sheet||'-')
        +' &#183; Telegram: '+(out.telegram?'b&#7853;t':'ch&#432;a')+' &#183; Email: '+(out.email?'b&#7853;t':'ch&#432;a')
        +(cu
          ? '<br><b style="color:var(--rust)">&#9888; Backend &#273;ang là B&#7842;N C&#360;</b> &#8212; ch&#432;a l&#432;u &#273;&#432;&#7907;c danh m&#7909;c BOM lên Sheet, các máy s&#7869; KHÔNG th&#7845;y d&#7919; li&#7879;u c&#7911;a nhau.<br>Hãy dán l&#7841;i <b>Code.gs</b> m&#7899;i r&#7891;i <b>Deploy &#8594; New deployment &#8594; New version</b>.'
          : '<br>Phiên b&#7843;n backend: <b>'+esc(out.version)+'</b> &#183; D&#7921; án trên Sheet: <b>'+(out.projects||0)+'</b>'
            +((out.projects||0)===0?' &#8212; hãy n&#7841;p BOM d&#7921; án &#273;&#7847;u tiên &#273;&#7875; các máy cùng dùng.':''));
    }catch(e){ m.innerHTML='<b style="color:var(--rust)">&#10007; '+esc(e.message||e)+'</b>'; }
  };
  $('#cfgMail').onclick=async()=>{
    const m=$('#cfgMsg'); m.innerHTML='&#8987; &#272;ang g&#7917;i báo cáo&#8230;';
    try{
      const rows=[];
      PROJECTS.forEach(function(p){ const st=projStat(p);
        if(st.recv>0||st.inStock>0) rows.push({customer:p.customer,project:p.project,towers:p.towers,
          recv:st.recv,onhand:st.inStock,pct:Math.round(st.pct)}); });
      const pend=ORDERS.filter(o=>o.status==='pending').length;
      const out=await apiPost({action:'report', by:(CFG.orderer||ROLE), pending:pend, rows:rows});
      m.innerHTML = out&&out.ok ? '<b style="color:var(--teal)">&#10004; &#272;ã g&#7917;i báo cáo qua email</b>'
                                : '<b style="color:var(--rust)">&#10007; '+esc((out&&out.error)||'l&#7895;i')+'</b>';
    }catch(e){ m.innerHTML='<b style="color:var(--rust)">&#10007; '+esc(e.message||e)+'</b>'; }
  };
  $('#cfgResync').onclick=()=>{ CFG.url=$('#cfgUrl').value.trim(); CFG.token=($('#cfgToken').value||'im').trim(); saveCfg(); apiResync(); };
  $('#cfgSave').onclick=()=>{ CFG.url=$('#cfgUrl').value.trim(); CFG.orderer=$('#cfgWho').value.trim();
    const np=$('#cfgPass').value.trim(); CFG.pass=np||DEFAULT_PASS;
    CFG.token=($('#cfgToken').value||'im').trim();
    saveCfg(); closeSheet(); toast('&#272;ã l&#432;u c&#7845;u hình',false,true); render(); };
  $('#scrim').classList.add('show'); $('#sheet').classList.add('show');
}
async function sendOrder(){
  if(!CART.length){ toast('&#272;&#417;n tr&#7889;ng',true); return; }
  const orderer=($('#fOrderer')?.value||CFG.orderer||'').trim();
  const note=($('#fNote')?.value||'').trim();
  if(orderer){ CFG.orderer=orderer; saveCfg(); }
  const btn=$('#sendBtn'); if(btn){ btn.disabled=true; btn.textContent='&#272;ang x&#7917; lý&#8230;'; }
  // gom theo dự án -> mỗi dự án 1 tín hiệu order
  const byproj=new Map();
  CART.forEach(c=>{ const key=c.pid; if(!byproj.has(key))byproj.set(key,[]); byproj.get(key).push(c); });
  let sent=0, backendErr=''; const newOrders=[];
  for(const [pid,lines] of byproj){
    const p=projOf(pid);
    const oid='o'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
    // tóm tắt theo section: mỗi section yêu cầu bao nhiêu bộ (dùng cho Telegram/Email)
    const bySec=new Map();
    lines.forEach(l=>{ const k=l.section||'(chung)';
      if(!bySec.has(k)) bySec.set(k,{sec:k,codes:0,qtys:[]});
      const g=bySec.get(k); g.codes++; g.qtys.push(l.qty); });
    const secs=[...bySec.values()].map(g=>{
      const u=[...new Set(g.qtys)];
      return { sec:g.sec, codes:g.codes, n: u.length===1 ? u[0] : null,
               total:g.qtys.reduce((a,b)=>a+b,0) };
    }).sort((a,b)=>secRank(a.sec)-secRank(b.sec));
    const order={ id:oid, dept:ROLE, orderer, note, customer:p.customer, project:p.project, pid, pkey:p.pkey,
      ts:Date.now(), status:'pending', secs:secs,
      lines:lines.map(l=>({code:l.code,desc:l.desc,section:l.section,qty:l.qty,unit:l.unit})) };
    // luôn lưu tín hiệu cho kho
    ORDERS.unshift(order); sent++; newOrders.push(order);
    // gửi lên Google Sheet + Telegram + Email
    if(apiReady()){
      try{ const out=await apiPost({action:'request', order:order});
        if(out&&out.ok===false) backendErr=out.error||'l&#7895;i backend';
      }catch(e){ backendErr=String(e.message||e); }
    }
  }
  saveOrders();
  CART=[]; saveCart();
  if(btn){ btn.disabled=false; }
  toast('&#10004; &#272;ã g&#7917;i '+sent+' yêu c&#7847;u sang kho'+(CFG.url?(backendErr?' (backend l&#7895;i)':' + &#273;ã g&#7917;i Telegram/Email'):' (ch&#432;a c&#7845;u hình g&#7917;i)'),false,!backendErr);
  tab='order'; buildNav(); render();
  // KHÔNG in tự động — người dùng chủ động bấm nút "In phiếu xuất kho (2 liên)" khi cần
}

// ===== VAI TRÒ & THANH ĐIỀU HƯỚNG =====
function navItems(){
  if(isKho()) return [
    ['dash','&#9632;','Trang ch&#7911;'],
    ['home','&#9750;','Nh&#7853;p/Xu&#7845;t V&#7853;t T&#432;'],
    ['stock','&#9636;','T&#7891;n kho'],
    ['order','&#128229;','V&#7853;t t&#432; yêu c&#7847;u'],
    ['hist','&#9776;','Ho&#7841;t &#273;&#7897;ng'],
  ];
  return [
    ['home','&#9750;','Tra c&#7913;u v&#7853;t t&#432;'],
    ['stock','&#9636;','T&#7891;n kho'],
    ['order','&#128203;','V&#7853;t t&#432; yêu c&#7847;u'],
    ['hist','&#9776;','L&#7883;ch s&#7917; yêu c&#7847;u'],
  ];
}
function buildNav(){
  const nb=$('#navBar'); if(!nb) return;
  const items=navItems();
  if(!items.some(x=>x[0]===tab)) tab=items[0][0];
  nb.innerHTML=items.map(([t,ic,lb])=>
    '<button data-tab="'+t+'"'+(t===tab?' class="on"':'')+'><span class="i"'+(t==='order'?' style="position:relative"':'')+'>'+ic
    +(t==='order'?'<span class="cartbadge" id="cartBadge"></span>':'')+'</span>'+lb+'</button>').join('');
  nb.querySelectorAll('button').forEach(b=>b.onclick=()=>{
    const t=b.dataset.tab;
    if(t==='home'){ cust=null; pid=null; sect=null; query=''; const qi=$('#q'); if(qi)qi.value=''; }
    tab=t; nb.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b)); render(); });
  const rt=$('#roleTxt'); if(rt) rt.innerHTML=roleName(ROLE);
  const rs=$('#roleShort'); if(rs) rs.innerHTML=(ROLE==='KHO'?'KHO':'IM');
  updateBadge();
}
function openRolePicker(first){
  sheetItem=null;
  $('#sheet').innerHTML='<div class="grab"></div><div class="scode">Ch&#7885;n vai trò s&#7917; d&#7909;ng</div>'
    +'<div class="sdesc">Ch&#7885;n vai trò &#273;ang s&#7917; d&#7909;ng máy này. M&#7895;i vai trò th&#7845;y &#273;úng ph&#7847;n vi&#7879;c c&#7911;a mình.</div>'
    +'<div class="rolegrid">'
      +'<button class="rolecard" data-r="IM"><span class="rt">IM</span><span class="rd">B&#7897; ph&#7853;n Internal Mounting<br><b>T&#7841;o yêu c&#7847;u v&#7853;t t&#432;</b></span></button>'
      +'<button class="rolecard kho" data-r="KHO"><span class="rt">KHO</span><span class="rd">Kho v&#7853;t t&#432; (Internal Warehouse)<br><b>Nh&#7853;n tín hi&#7879;u &#183; nh&#7853;p &#183; xu&#7845;t</b></span></button>'
    +'</div>';
  $('#sheet').querySelectorAll('.rolecard').forEach(b=>b.onclick=()=>{
    ROLE=b.dataset.r; saveRole(); closeSheet();
    cust=null; pid=null; sect=null; query='';
    tab=isKho()?'dash':'home';
    buildNav(); render();
    toast('&#272;ang dùng v&#7899;i vai trò: '+roleName(ROLE),false,true);
  });
  $('#scrim').classList.add('show'); $('#sheet').classList.add('show');
  if(first) $('#scrim').onclick=()=>{};   // lần đầu bắt buộc chọn
}
$('#roleBtn').onclick=()=>{ $('#scrim').onclick=closeSheet; openRolePicker(false); };
$('#syncBtn').onclick=()=>apiSync(false);
$('#cfgTop').onclick=()=>{ $('#scrim').onclick=closeSheet; openCfg(); };
// tự đồng bộ: khi mở app, mỗi 60 giây, và khi quay lại tab
setTimeout(function(){ apiSync(true); },1500);
setInterval(function(){ if(!document.hidden) apiSync(true); },60000);
document.addEventListener('visibilitychange',function(){ if(!document.hidden && Date.now()-lastSync>15000) apiSync(true); });
$('#q').oninput=e=>{ query=e.target.value; if(query.trim())tab='home'; render(); };
$('#btnReset').onclick=()=>{ if(confirm('Xoá toàn b&#7897; l&#7883;ch s&#7917; nh&#7853;p/xu&#7845;t trên máy này?')){ TX=[]; idxBuild(); save(); toast('&#272;ã xoá l&#7883;ch s&#7917;'); render(); } };

let stream=null,scanning=false,detector=null;
$('#btnScan').onclick=openScan; $('#scanClose').onclick=closeScan;
$('#manualGo').onclick=()=>{ const v=$('#manualCode').value.trim(); if(v)findAndOpen(v); };
$('#manualCode').onkeydown=e=>{ if(e.key==='Enter'){ const v=e.target.value.trim(); if(v)findAndOpen(v); } };
async function openScan(){ $('#scan').classList.add('show');
  if(!('BarcodeDetector' in window)){ $('#scanHint').innerHTML='Thi&#7871;t b&#7883; không h&#7895; tr&#7907; quét t&#7921; &#273;&#7897;ng &#8212; hãy gõ mã bên d&#432;&#7899;i.'; return; }
  try{ detector=detector||new BarcodeDetector({formats:['qr_code','code_128','code_39','ean_13','data_matrix']});
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
    const v=$('#video'); v.srcObject=stream; await v.play(); scanning=true; loopScan();
  }catch(e){ $('#scanHint').innerHTML='Không m&#7903; &#273;&#432;&#7907;c camera &#8212; hãy gõ mã bên d&#432;&#7899;i.'; }
}
async function loopScan(){ if(!scanning)return;
  try{ const c=await detector.detect($('#video')); if(c&&c.length){ closeScan(); findAndOpen(c[0].rawValue.trim()); return; } }catch(e){}
  requestAnimationFrame(loopScan); }
function closeScan(){ scanning=false; $('#scan').classList.remove('show'); if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;} $('#manualCode').value=''; }
function findAndOpen(raw){ const q=raw.trim().toLowerCase();
  let it=ITEMS.find(i=>i.code.toLowerCase()===q)||ITEMS.find(i=>i.code.toLowerCase().includes(q));
  if(it){ tab='home'; query=''; $('#q').value=''; openSheet(it); }
  else{ query=raw; $('#q').value=raw; tab='home'; render(); toast('Không th&#7845;y "'+raw+'"',true); } }

let toastT=null;
function toast(msg,bad,good){ const t=$('#toast'); t.innerHTML=msg; t.className='toast show'+(bad?' bad':good?' good':''); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),2200); }

if(!ROLE){ tab='home'; buildNav(); render(); openRolePicker(true); }
else { tab=isKho()?'dash':'home'; buildNav(); render(); }
updateBadge();
</script>
